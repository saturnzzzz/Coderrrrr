*科技赋能 (L1_4_2)**方面存在障碍，“搞不明白这些外卖软件”。然而，他们通过参与电视相亲节目这种**休闲娱乐 (L1_2_3)**活动，积极寻求改变。文章通过众多生动的个体案例，构建了老年人情感生活的**成功典范 (L1_5_2)**，并在一定程度上改变了社会对老年人的**文化环境 (L1_4_4)**认知。\n\n**Level 2 编码分析：**\n本文与**框架一：活力自主的“第二人生” (L2_1)**高度契合。文章中的老年人摆脱了传统观念的束缚，对爱情、对性、对伴侣选择有着明确而直接的追求，不避讳金钱，也不为面子所累，展现出极强的生命活力和自我主导性。那位热爱打扮、唱歌弹琴的大姐更是“活力自主”的直接体现。\n\n其次，文章深刻体现了**框架二：情感丰盈的“圆满时节” (L2_2)**。老年人普遍存在的“孤独感”是他们寻求伴侣的强大动力，通过相亲追求“后半生的伴儿”，渴望内心的温暖与充实，这直接指向了对爱情和亲密关系的强烈需求。\n\n最后，文章也部分反映了**框架三：未雨绸缪的“规划项目” (L2_3)**。老年人在相亲中对对方健康、经济状况的审慎考量（如为求保障而提出的金钱要求），以及对未来共同生活的慎重态度（“再找老伴就是要过一辈子的”），都表明他们对晚年伴侣关系有着明确的现实规划和保障需求，这是一种对晚年生活风险的理性应对和规划。","highlights":[],"timestamp":1647878400000,"l1Names":["积极心态","自主独立","休闲娱乐","身体管理","经济活动","亲密关系","代际关系","朋辈社交","经济资本","科技赋能","适老环境","文化环境","成功典范","挑战与应对"],"l2Names":["框架一：活力自主的“第二人生”","框架二：情感丰盈的“圆满时节”","框架三：未雨绸缪的“规划项目”"],"dateStr":"2022/3/22"},{"uuid":"5dc0c805-1071-43cb-80d7-13fd0a7b860d","title":"惠英红：近期高分国产电影里，她演出最真的“老年爱情...","articleUrl":"https://www.lifeweek.com.cn/article/208212","content":"我眼前的惠英红穿着白色T-shirt和牛仔裤，利落舒适。入行拍戏几十年，无论打戏还是文戏，她在业内都是出了名的拼命，身上似乎有一种不知疲倦的力量。“拿到每一个角色，我都会在心里想，我能不能做得再好一点？其实很多人会说你都到了这个年纪，为什么还要这么拼命？我的想法跟一般人不一样，人总会有离开的那天，我希望我离开的时候可以留下一些东西，一直流传。”\n记者｜卡生\n本分\n在电影《我爱你！》中，惠英红饰演孤寡拾荒老人李慧如，和她演对手戏的是老戏骨倪大红，两人上演了一段感人的老年人爱情。最初拿到剧本时，公司对于让她出演李慧如比较犹豫，因为这个角色并不是最有戏剧冲突的，比倪大红、梁家辉以及叶童的戏都要显得平淡得多。演技“炸裂”的戏对于63岁的惠英红而言，是她曾解过的一次次证明题，现在她对角色的判断有另外的考量。\n“越是平淡的角色，越考验演技的精准。平淡的角色太用力会抢了对手的戏，如果演得太平淡又会被观众忘记，反而拖垮了整部电影。这是演员很怕的一类角色，不能使劲演，却要让观众记得角色的点点滴滴。”惠英红决定不顾公司反对，接下这部影片里这个具有“穿针引线”作用的角色。\n电影《我爱你！》剧照，惠英红饰李慧如，倪大红饰常为戒\n惠英红饰演的李慧如和倪大红饰演的常为戒从不打不相识，到互生情愫的情感转变是影片前半段主要讲述的故事。故事中呈现出老年人相爱时会遇到的诸多问题——如何面对衰老、病痛、死亡、遗憾？为子女付出一辈子，是不是真的可以在老年时还自己时间，冲破现实桎梏自由地爱一把？这种黄昏恋题材在电影市场里是特殊的，尤其考验演员的尺度感。惠英红的表演方式是要尽可能地还原角色生活的场域，要真的去“爱”，让自己进入一种恋爱的状态。“拍片的70多天，我真的很爱常大哥。”\n《我爱你！》中有一段李慧如和常为戒在游乐园拍拖的戏，两个老人手拉着手像孩子一样玩耍，这种区别于年轻人拍拖的情绪让惠英红想起小时候父母之间的相处。“小时候家里穷，我们住在公屋，每天晚上吃完饭父母会带着我和妹妹去附近的公园，父亲拉着母亲的手走在前面，我们走在后面。有一次母亲说很想玩公园里的荡秋千，结果父亲一把推猛了，母亲从上面掉下来摔断了手。”惠英红将儿时看到的父母相处的模式，也放到了影片的情感关系中。\n《我爱你！ 》剧照\n拍摄的头几天，惠英红觉得倪大红有些社恐，自己的戏演完，就找一个没人的角落“躲起来”。惠英红观察着倪大红，有时故意走过去聊几句，有时远远地用眼神传递着对倪大红的关注。两人之间你来我往的小情绪建立的过程，一开始让倪大红有些不适应，后来他渐渐习惯了惠英红偷偷注视的目光。“那是一种‘爱’的感觉，对方的一言一行都会牵动你的情绪。他就算是一座冰山，也应该被我融化了。”惠英红笑着说。这种工作方法对科班出身的演员而言明显是会伤筋动骨的，但对惠英红而言却另有一番趣味。\n《我爱你！ 》剧照\n很多年前，惠英红在出演《血观音》时，演员文淇曾被她强大的气场吓得不敢说话，后来惠英红说那是为了不出戏而制造的一种距离感。惠英红坚持着自己的一些“笨方法”，她愿意在一些观众看不到的地方下功夫进入角色的内心。熟悉角色的习惯、说话方式、心理变化，不是靠演，而是一种下意识的肌肉记忆。如果角色的心理历程无法说服她，那证明也无法说服观众。\n惠英红说，她在李慧如的身上看到了自己过去的影子，曾经出生在大户人家，后来家道中落，经历了爱人去世，终生未嫁。虽然生活在底层，靠捡空瓶子补贴家用，骨子里却有一种抹不掉的尊严。“李慧如就像一只受伤的小猫，她自卑，富有攻击性，在陌生人靠近时容易炸毛，但一切都是为了保护自己。和常大哥的爱情让她放下了戒备，但她时刻担心一切美好都会失去。”\n《血观音》剧照\n在惠英红看来，这是一个杂念很多的角色，所以在她成为李慧如之后，尽管是“收着”演，却可以从李慧如的眼睛里看到不同阶段的情绪变化。既不能抢了别人的戏，又不能没有存在感，这是惠英红近些年饰演角色时没有过的挑战。拍戏时，惠英红每天坚持用肥皂洗脸，李慧如要有一种饱经沧桑感；到了片场，脸上还要糊上胶水做的老年妆，戏拍完了，脸上长了很多雀斑。这些为角色付出的点滴在惠英红的叙述里就像是演员的本分，“一切都得来真的，观众看得出来”。\n《我爱你！ 》剧照\n拍摄过程中，导演很少对惠英红的表演提要求，他很信任惠英红对这个角色的处理。唯独有一场戏，是常为戒开着车送李慧如回老家，途中正有一对新人在办婚礼。常为戒和李慧如看着那对新人，嘴里说出了“我愿意”。导演韩延说：“如姐，你说这句话时，帮我加千分之一的甜。”当下的李慧如失去了在这个城市里的所有亲人，整个人都是空洞的，没有了寄托和依附，那一声“我愿意”承载的是她对爱的渴望和想象。杀青之前，惠英红忍不住问导演：“你为什么在拍摄过程中都不管我？我是一个需要导演鼓励赞美的人。”听上去是一种很骄傲的玩笑，但对惠英红而言，进入角色，如同进入某个人的一段人生。\n《我爱你！ 》剧照\n漩涡\n“高高低低”是惠英红挂在嘴边的话，“我的一生，是别人的两世”，每次经历生活的痛击之后，她反而变得更强大。惠英红的故事很像一部传奇电影，父亲出自名门望族，上世纪60年代一家人从山东逃难到香港。惠英红3岁开始跟随母亲、妹妹上街要饭，在湾仔一带卖口香糖，13岁在红灯区夜总会跳舞，16岁遇到改变她命运的导演张彻，代替临时撂挑子的演员出演了《射雕英雄传》里穆念慈一角，算是进入了香港娱乐圈⋯⋯\n《射雕英雄传》剧照\n惠英红提到过去的苦难时轻描淡写，“我的一生恰好经历了不同时代的变化，我自己就是不断身处在时代的漩涡中”。这句话不假，惠英红出道即达巅峰，赶上了香港电影的黄金时代，尤其是赶上武打电影最为卖座的时候。她身形矫健，因学过戏曲有武打底子，又肯努力，吃得了别人吃不了的苦。那时候武打演员男性多，女性却很少，这是上天给她的机遇。\n她回忆说，那时候香港一年有400多部电影开拍，一年里她差不多要演十几部戏。作为“打女”，她是出了名的不要命，拍戏时在没有替身愿意从16楼跳下的情况下，她选择自己上，最后还是出了意外，但好在没有生命危险。惠英红自从出演了刘家良的《烂头何》之后名声大噪，各种打戏找上门来，上世纪70年代末至80年代初，她成了香港武打戏里的扛把子“打女”。\n《烂头何》剧照\n尽管浑身是伤，21岁的惠英红还是迎来了自己的高峰时刻，年纪轻轻就以电影《长辈》夺得第一届香港电影金像奖影后，这是香港电影史上唯一一个武打影后。出身底层的惠英红不再为了生计而接戏，她发现自己是真的热爱拍戏。\n《长辈》剧照\n黄金时代，香港明星有各自明确的标签，这样找演员比较有效率，惠英红靠“武打”安身立命，同时期出道的钟楚红主打的是“性感”，张曼玉是“玉女”，这意味着转型在那个时代是一件特别困难的事情。那时惠英红签约在邵氏公司，好不容易培养出一个能打的明星，邵氏怎么会轻易放弃。惠英红入行十几年，身上大伤小伤无数，她意识到“武打”是个吃青春饭的行当，其间想要转型却受到了邵氏的阻挠。随之而来的90年代，香港的喜剧和文艺片替代动作、武侠片成为当时的主流电影。\n《武侠》剧照\n“感觉是突然某一天，没有人再来找你拍戏。”时代风向转变，即使贵为影星也如此，无戏可拍的惠英红从高峰跌入了谷底，就算零星有戏约，找来的也都是婆婆或者妈妈一类的角色。惠英红一向好强，年轻气盛且高处跌落，怎么受得了？惠英红患上了抑郁症，“我是一个曾经躺平很多年的人”。和抑郁症对抗的那几年，是常人难以想象的，最后她决定放弃自己，试图吞安眠药自杀，被家人从鬼门关救了回来。之后，她想明白一些事情，“我不能被情绪病打倒，连死都不怕，我还怕活吗？”\n《幸运是我》剧照\n惠英红放平心态，为复出做准备，在这个时间段她不断学习充实自己，为了克服自己的情绪病，她还考了心理咨询师执照。惠英红告诉我：“那会儿我的身体里住着另一个人，不断在拉扯内耗。”当时她有一个信念，如果被情绪病打倒，那她永远不可能演戏，她要学习的是理解自己，和情绪病相处。沉寂多年之后，在不断了解自己的过程中，她似乎开了窍。她想起13岁在湾仔剧院门口被点燃的人生意义——成为明星，被看见，被认可。她梳妆打扮，出现在导演、制片人们常常出现的场所，看上去像是偶遇，实际上都是刻意为之，一切看似有机会的戏，她都不再放过。\n2005年复出后，她对于是出演电影还是电视剧、角色是大是小，不再挑剔。得让自己忙起来，在角色中历练。千禧年之后，香港TVB大行其道，随着《冲上云霄》和《金枝欲孽》的热播，TVB横扫海峡两岸暨香港。她在这个时间段出演了《巾帼枭雄》《宫心计》，被称为“TVB的金牌绿叶”，她还在电影《新倩女幽魂》和《无间道2》中饰演了一些比较小的配角。\n《宫心计》剧照\nTVB这股风潮流行没几年，在2008年之后渐渐式微，内地与香港合拍片成为这个阶段的主流，小而美的香港文艺片深得观众喜爱。2009年，惠英红出演了合拍片《心魔》中控制欲强的单亲母亲。片中有一个长镜头，在巨大的变故到来时，惠英红双眼含泪，脸上露出一种被命运嘲弄的笑容，堪称教科书般的演技。\n这部作品虽然投资不大，却让50岁的惠英红时隔27年再度拿下金像奖最佳女主角。她没有想到自己会获奖，甚至没有准备演说词。作为从深渊中爬出来的人，她的获奖感言道出了蛰伏这些年的真情实感：“曾经风光了十几年，然后不知道为什么会跌到谷底，不知道为什么没有人找我，不知道为什么逼自己进入死巷。我把自己藏了很久，不知道怎么办好。我连放弃自己的生命都试过，因为真的不知道自己将来怎么样。但我现在很有信心，我知道我是属于电影的，哪怕是一天、两天，只要是好角色，我都会尽量做好。”这段获奖感言让人唏嘘，惠英红等了20年再度站在台前被重新看见。\n《心魔》剧照\n此后，惠英红的戏路被打开，一部接一部的戏，指向的都是那些身处边缘和黑暗中的人。越是那些复杂、黑暗的角色她演起来反而越发得心应手。她说：“这些角色就像熟悉的老朋友，让我变成她对我来说轻而易举。”人生过半，她找到了发力的节奏——电视剧《刑侦日记》中她饰演一名精神分裂症患者，《幸运是我》中出演一名患有阿尔茨海默病的独居老人，《血观音》里饰演毒辣阴狠的棠夫人。\n《幸运是我》剧照\n惠英红每饰演一个角色，都不允许自己虚构角色的情绪。当问起她会不会担心接近黑暗是一种危险？惠英红陷入思考，“我还没有想过这个问题，但每一次杀青前的最后几场戏，我都会在心里和这个角色告别。结束了，你要回来重新开始生活”。\n《血观音》剧照\n惠英红喜欢研究人，更喜欢观察人，这是3岁之后练就的生存技能。“小时候出去讨饭，如果找错了人，人家还会打你，白白浪费了时间，所以从小就会找好说话的人，表达可怜。”直到今天，她对周遭的人和事依然保持着敏感的观察力，像一只蹲守在草丛里伺机而动的野兽。对生活的危机意识一直存在，改是改不了了。她告诉我，投入身体和情绪拍戏非常累，回到家也想休息，但如果超过一个星期没有人找她，她会慌，觉得自己没有了价值。她要强，凡事要求做到极致，下意识地敏感，担心自己表现差而丢人。此时的惠英红聊起几十年前的旧事，脸上虽然笑着，却让人心疼。\n电影《我爱你！》剧照，李慧如眼神平静却蕴含力量\n惠英红的人生跌宕起伏，历经沧桑，她的美是坚定、自信的，但其中也包含了命运逼迫出来的韧性。到了60岁，她也在慢慢调整，说服自己放松下来，要学会假装是“近视眼”，做一个糊涂且开心的人才最重要。是否考虑息影退休？她觉得自己终归是无法离开银幕的，演戏才是保持生命力最好的方法。","level1Selections":["L1_1_1","L1_1_2","L1_1_3","L1_1_4","L1_2_2","L1_2_3","L1_3_1","L1_5_2","L1_5_3"],"level2Selections":["L2_1","L2_2","L2_3"],"notes":"该文章通过讲述演员惠英红的职业生涯以及她在电影《我爱你！》中饰演的李慧如一角，展现了对**理想老年生活**的深刻洞察。\n\n文章首先突出了惠英红本人**积极向上**的**心态与身份**（L1_1_1）。她面对人生“高高低低”的挑战，始终秉持着“我希望我离开的时候可以留下一些东西，一直流传”的信念，体现了强烈的**价值感**（L1_1_3）。即使遭遇事业低谷和抑郁症的困扰，她也能重拾**积极心态**，发出“连死都不怕，我还怕活吗？”的呐喊，并通过**终身学习**（L1_2_2），如考取心理咨询师执照、学习理解和与情绪病相处，为“第二人生”做足准备。她对演戏的执着和对角色的深入研究，如“她对周遭的人和事依然保持着敏感的观察力”，也展现了她持续学习和适应的能力。60岁时，她选择“做一个糊涂且开心的人”，并认为“演戏才是保持生命力最好的方法”，这不仅是**积极心态**的体现，也暗示了**接纳衰老**（L1_1_4）的一种方式，即通过心理调适来应对年龄增长。\n\n电影《我爱你！》中李慧如与常为戒的**老年爱情**是文章的核心。这段感情描绘了老年人如何在晚年“冲破现实桎梏自由地爱一把”（L1_1_2），追求**亲密关系**（L1_3_1）的**自主独立**。两个老人在游乐园“手拉着手像孩子一样玩耍”，展现了老年人也可以拥有**休闲娱乐**（L1_2_3）的浪漫与纯真。李慧如对爱的渴望和想象，最终通过一句“我愿意”承载，让**情感丰盈**（L2_2）成为老年生活的关键组成部分。惠英红在塑造角色时，深情投入，“拍片的70多天，我真的很爱常大哥”，这种真实情感的注入使得电影中的老年爱情更具说服力，也使其成为了**成功典范**（L1_5_2）式的叙事。\n\n惠英红的人生经历本身就是一个**挑战与应对**（L1_5_3）的典范，她从低谷爬起，为复出做准备，这与**未雨绸缪的“规划项目”**（L2_3）框架相符。她对事业的**价值感**驱动她不断追求卓越，即使面对“没有人找我”的困境，也能通过主动学习和积极行动，重新获得“我是属于电影的”这份自信和**价值感**。整体来看，文章通过惠英红的**活力自主**的“第二人生”（L2_1）和电影中**情感丰盈**的“圆满时节”（L2_2），共同构建了一个积极、有意义且充满情感链接的理想老年图景。","highlights":[],"timestamp":1688486400000,"l1Names":["积极心态","自主独立","价值感","接纳衰老","终身学习","休闲娱乐","亲密关系","成功典范","挑战与应对"],"l2Names":["框架一：活力自主的“第二人生”","框架二：情感丰盈的“圆满时节”","框架三：未雨绸缪的“规划项目”"],"dateStr":"2023/7/5"},{"uuid":"e6d96ea1-1ced-4519-8bd7-9a672c5c8875","title":"开年最强律政爽剧：当老年女性重返职场“大杀四方”","articleUrl":"https://www.lifeweek.com.cn/article/241063","content":"“七十岁正是闯的年纪”，这样的故事越来越多了。\n一方面，延迟退休年龄似乎是世界潮流。另一方面，在很多行业里，35岁就已经是“老年人”了。我们越发关注以老年人为主角的故事，或许正是在这个两难处境里寻找一种情感寄托。我们想在这些故事里看到：人老了也还是有价值的，宝贵的经验可以弥补衰减的体能。我们希望这些故事能够证明：世界不应该只有KPI，还应该有人情味。\n《老练律师》正好能满足我们的这种需求。它是80年代一部同名律政剧的翻拍，但把主角从一个中年男律师本·麦特洛克换成了一个老年女律师麦德琳·麦特洛克。请注意，这并不是基于政治正确的噱头，因为很明显，“老年人”的身份并没有为主角带来什么红利，反而让她在职场上获得成功的难度倍增。\n一个老年妇女，如何在堪称“内卷地狱”的一流律所里逆袭？这正就是本剧的最大看点。从它的良好口碑（豆瓣8.6）和提前续订第二季来判断，这个难题它解答得很好。\n让我们先来看一下精彩的开头：75岁的麦德琳，身披一件同头发一样灰白的大衣，坐在一幢高档写字楼底层的咖啡店里。她先佯装手机故障，让排她后面赶时间的精英小伙替她买单了一杯咖啡。然后她又以端着咖啡不方便为由，让热心的保安刷卡穿越门禁。她谈笑间用一颗糖“贿赂”电梯里的同行者稀里糊涂帮她刷卡按了楼层。最后她凭借和蔼的笑容和自信的气场，健步走进一家顶级律所。\n整个过程里麦德琳极其老练，竟像极了《豺狼的日子》里的那个顶级杀手。只不过她直奔老板不是为了刺杀他，而是为了要一份工作。\n《老练律师》一开始就挖掘了老年人的独特优势：那就是一般人对老年人会降低防备心。用麦德林自己的话来说，就是自己是一个“隐形人”，可以大模大样地坐在一旁偷听机密，根本没人在意。这种社会意义上的“隐形”，相比于物理层面的“隐形”，其实是一种更高级的超能力。因为隐形的麦德林不仅能轻易混进一个门禁重重的大公司，也可以神不知鬼不觉地潜入交谈对象的内心。\n律师查案，靠的不是高科技，而是一张嘴皮子，关键的证人就在眼前，关键的信息就在此人心中，能不能用话套出来，便是成败所在。麦德琳单凭一招平易近人，便能屡建奇功。\n麦德琳其实在一开始求职的时候，就坦诚自己已经不当律师30年了，这次复出全为生活所迫。很显然，硬桥硬马地拼法律知识，卷工作时长，她绝不可能干得过年轻人。我们要看的其实也是她如何用巧劲来击败简单粗暴的职场内卷。\n在真正的职场上，我们讨厌投机取巧之辈，但观众并不会讨厌麦德琳的伪装和谎言。因为我们很快会发现，她的道德水平明显高于她的同侪。因此她的胜利不仅仅属于她个人，同时也是社会正义和良知的胜利。\n她经手案件的受害人，其实也都是被侮辱、被忽视的“隐形人”。他们是被警察屈打成招的犯人、被雇主栽赃嫁祸的哑巴员工、被屡屡性骚扰却拿不出证据的女职员、死于食品中毒儿童的家属、被莫名网暴的保姆……隐形人帮助隐形人，弱势者搀一把弱势者，这也是此剧的一大动人之处。\n麦德琳的律所之所以会接这些关乎社会公义的案子，倒不是出于额外的善心。在全剧一开始就有个小律师说了，律所接这些案子纯粹是因为可以名利双收，“把他们的痛苦转换成我们的收入”。实际上律所可能是世界上最冷酷功利的地方。按小时收费的工作习惯，让律师们不愿意多说一句“废话”。还有比这更功利的做派么？\n所以麦德琳的到来，反而是为这个冰冷的地方注入了一些温暖和欢乐。她很会滔滔不绝地耍嘴皮子，要是一个年轻人像她这样，恐怕难逃油腔滑调的讥评，但放进一个老年人的嘴里，倒显得相当欢乐。\n《老练律师》其实可以算一部喜剧，因为它符合喜剧最基本的定义，就是把一个人放入不适合自己的环境中。麦德琳不是为了搞笑而搞笑，而是要把自己一个高龄老人在律所里的格格不入，用各种饶舌的笑话来化解掉。这有点像《美丽人生》里，父亲哄骗儿子，被关进集中营其实只是为了玩一个游戏，而为了维持谎言，这位父亲就必须做出种种出格的言行。\n《老练律师》也是这般举重若轻。为了消解75岁出来打工的沉重感，编剧除了赋予麦德琳“隐形”和“搞笑”两大法宝以外，还特意增添了一层更复杂的背景。工作到深夜的麦德林登上公交车，只坐一站便下了，她走过一个转角，竟有一辆豪车恭候多时。车把她载向一个小古堡般的大豪宅……原来，她非但不愁生计，反而是个土豪。她潜入律所，原来是为了替死去的女儿讨回公道，那个案子涉及大医药公司的内幕。\n这条线为全剧提供了一条主轴，同时也让麦德林的日常生活显得更加刀光剑影。她不仅要对外应付案件，对内还要不停地与同事周旋，不停地盗取他们的密码和机密文件。而每次在露馅的边缘，她都可以用老年人的手忙脚乱糊弄过去。而喜剧元素和惊险元素也因为这个隐藏任务而完美地结合到了一起。\n《老练律师》的第一季非常“复古”地长达18集，目前只播到第八集，所以对于主线的医药大案，还远远看不到全貌。不过，我们还可以从另外一个角度来看待这条伏线的设定。\n如果说麦德琳的隐藏富豪身份，类似于《抓娃娃》那种喜剧设定，只是在“逼不得已的生活”外面裹上一层“其实都是装的”糖衣，那么麦德琳的隐藏任务显然并不只是为故事裹上了一层悬疑色彩。年轻人辛勤工作，是为了当下和未来的生活，但在老年人身上却并不只是如此。“老年人的职场剧”有一个特殊的使命，就是要跟过去和解，或者说弥补过去的遗憾。\n时间不能倒流，现实无法穿越。老年人的复出，在最核心的情感层面上，其实是“如果能再来一次”的变奏。\n麦德林曾含泪说，“要是能救女儿，她会做任何事。”她大费周章地潜入律所，每天手忙脚乱地虚与委蛇，虽然不能令女儿死而复生，但也证明了“愿意做任何事”并非虚言。法律是她的复仇手段，但她征服观众靠的却是情感上的共鸣。故事给了75岁的她一个新的机会，而渴望这种机会的显然并不只是老人。\n观看此剧，我一直在想，“老人”究竟应该如何定义。因为看着麦德琳的样子，如果她不说自己75岁，也许我会猜她只有六十来岁（实际上扮演她的凯西·贝茨已经76岁了！）。然而具体的数字，恐怕都是刻舟求剑。不久前韩国提议在法律层面上，把老年人的门槛从65岁提高到70岁。其实不难设想，这个门槛随着平均寿命的延长还会一再提高，假如人的寿命提到到120岁，那么过去的“古稀之年”也不过是“半辈子”而已。\n倒不如从心理层面来定义更加本质一些。“老人”的定义应该是“有过去、有遗憾的人”。杨德昌经典电影《一一》里面，十岁的小男孩忽然感慨“我也老了”，并非强说愁，而是感受到，哪怕在短短十年的人生里，也已经有了一点点挥之不去的遗憾和惆怅。\n观众越发关注老年题材的故事，并不仅仅因为大家都在“变老”，而是因为我们在某种程度上其实早已是“老人”。老人的那些痛苦，不论是心理层面的遗憾，还是社会层面的弱势、被忽视，其实我们也都多多少少体验过。而那些带有传奇色彩或包装成喜剧的老年人逆袭故事，如果能像《老练律师》一样讲好，便也不仅仅是在呼唤对于老年人的现实关怀，同时也总是包含一层形而上的诗意，用木心的两句诗来就是：\n“岁月不曾饶过我，而我亦不曾饶过岁月。”","level1Selections":["L1_1_1","L1_1_3","L1_1_4","L1_2_1","L1_2_5","L1_3_2","L1_4_1","L1_4_4","L1_5_2","L1_5_3"],"level2Selections":["L2_1","L2_2"],"notes":"文章以美剧《老练律师》为例，深刻探讨了**理想老年生活**的多个维度。首先，剧集主角麦德琳展现出强烈的**积极心态 (L1_1_1)**，尽管75岁高龄，她仍能“重返职场‘大杀四方’”，以“七十岁正是闯的年纪”作为行动力，这与普遍认为老年人应退居幕后的刻板印象形成鲜明对比。她的成功实践了**价值感 (L1_1_3)**，证明“人老了也还是有价值的，宝贵的经验可以弥补衰减的体能”。麦德琳在职场上利用“隐形人”的独特优势屡建奇功，体现了老年人在**社会参与 (L1_2_1)**中，通过智慧而非体力，依然可以发挥巨大作用。同时，她的复出既有**经济活动 (L1_2_5)**的驱动（“全为生活所迫”），更深层的原因是为了“替死去的女儿讨回公道”，这关联到**代际关系 (L1_3_2)**，并为她的**价值感**赋予了更深层次的情感意义。在**挑战与应对 (L1_5_3)**方面，麦德琳在“内卷地狱”般的律所里，运用“巧劲”和“平易近人”化解难题，甚至将老年人的“手忙脚乱”作为伪装。文章还触及了**文化环境 (L1_4_4)**对老年人的再定义，提出“老人”应从“有过去、有遗憾的人”的心理层面来定义，而非刻板的年龄数字，这反映出对**接纳衰老 (L1_1_4)**的新视角。麦德琳隐藏的“土豪”身份（**经济资本 L1_4_1**）虽是剧情反转，但更凸显了其行为的自主性，使其成为**成功典范 (L1_5_2)**。总体而言，该剧和文章描绘的**理想老年生活**契合了**框架一：活力自主的“第二人生”**，强调老年人依然可以充满活力地追求目标、实现自我价值；也高度符合**框架二：情感丰盈的“圆满时节”**，通过弥补遗憾、寻求正义，达到内心深处的情感满足和人生和解。","highlights":[],"timestamp":1737302400000,"l1Names":["积极心态","价值感","接纳衰老","社会参与","经济活动","代际关系","经济资本","文化环境","成功典范","挑战与应对"],"l2Names":["框架一：活力自主的“第二人生”","框架二：情感丰盈的“圆满时节”"],"dateStr":"2025/1/20"},{"uuid":"c8bdb849-7ac4-4f02-97b7-1a0383a7d74e","title":"100一学期，年轻人抢着上的“老年大学”有多香？","articleUrl":"https://www.lifeweek.com.cn/article/203851","content":"三分钟热度也有三分钟的收获，进一寸有进一寸的欢喜，兴趣而已，没那么多条条框框。\n文｜读者：是大可呀\n曾经我单纯地将年轻与灵活挂钩，幻想着稳居广场舞C位，却在老年舞蹈课上连连败下阵来，躲在人群后面不敢直视老师的眼睛，低头揣摩极速走位的步子。 身旁的林阿姨瞧见我灰溜溜的样儿，一掌拍直我的背，“挺起来！年纪轻轻的咋比我们还老气横秋。三二一，跟着摇摆接着跳！”\n《欢迎光临》剧照\n比起差距较大的年龄，更格格不入的是我僵硬的动作，在这十人规模的老年兴趣班里，我是看似机灵实则笨拙的吊车尾插班生。起初进班级时，她们还误以为我是新来的舞蹈老师，笑着问当天的教学内容，我讪讪解释：“我是四楼办公室兼职的学生，没事过来看看”。也许是天生手脚不协调，跟练几次的舞姿却连均龄60的老太太也比不了，可她们并没有笑话我，课堂上人人都是舞蹈家，有博大的胸怀和无限的耐心，你方唱罢我登场地带着我一遍遍学基础的手位与步伐。原本来蹭热闹的我，被这其乐融融的氛围打动，当下缴费后正儿八经地学了两个月。\n进入老年兴趣班的契机说来也巧，大三下学期只有零零散散的几节选修课，但又不能完全离校去长期实习，闲来无聊就应聘了附近办公楼里的勤工助学岗位，忽略报酬的因素，这称得上一份完美的工作：离住所步行2分钟、事务清闲到一天三小时我有两个半小时在发呆看风景、常有饭票车票零食票的补贴、接触的人多是受过教育、态度温和的退休人员……恰好帮带教老师交表格时遇见正发愁的排课主任，她说：“本学年工作处要开班授课丰富老年职工生活，但人数不够凑不了班。”我看向她桌上的表格，课程涵盖舞蹈、书画、素食制作、智能手机应用、曲艺等领域，类型丰富内容有趣，但最令人心动的，还是那一门一学期一百元的学费。\n《幸福院》剧照\n授课场地就是我兼职的这栋办公楼，一共四层，建造之初就配有健身房以及排练厅、棋牌室、书法室，再加上学校的行政补助，学费自然低廉。一周一课，一次两小时，平摊下来几乎不要钱，更何况授课老师还是学校里的年轻教授，性价比简直高到离谱。我试探着问负责招生的主任，她回答：“虽然是专门给退休教职工开办的，但人也没招齐，你要是有兴趣就来呗，平时工作不忙也可以去。”\n首次国画课结束后，我对自己的作品颇为满意，然而当我将这个好消息发布到朋友圈时，父母打来电话问询，还是那忧心忡忡的老样子：“别瞎搞那些有用没用的，在你的年纪好好学习才是正道。”\n《二十不惑》剧照\n言辞不算委婉，但我早已习惯这样的劝诫，父母害怕我玩着玩着心思就不在学业上，拿着他们的血汗钱在外鬼混最终一事无成，一旦发现娱乐的苗头即使相隔千里也要把我往回拉，似乎成天泡在图书馆与习题打交道才是正事。纵使这样的推导公式令我瞠目结舌，但也不会反驳，因为我知道农村的每一分钱都来之不易，吃惯了苦日子的他们对花钱的唯一评判标准是“有用”，绝不会向“未知”付费。\n我还记得小学时常常要举办艺术节，每班都要有节目上台表演，我往往只有待在观众席上卖力鼓掌，眼里满是羡慕。曾鼓起勇气向妈妈请求学钢琴，毫无意外地被一口回绝：“你知道钢琴多少钱吗，咱家也没闲地放！”我又不死心提了无门槛的声乐课，她摆手说：“唱歌是能当饭吃还是当衣穿呀！再说了这东西需要学吗，不是人人有嘴张口就会？”说着说着爸爸也听到了，我知道再缠下去会扣上一顶“不懂事”的帽子，立马闭嘴回屋写作业，将升起来的兴趣心压在笔下，在琴行的宣传单上划一道又一道痕迹，再也没提过要学什么东西。\n兴趣班是我接触到的第一座围城，尽管在十八线小城也遍地生花，年纪稍小时我即便是路过也要溜进去观摩老师的技巧，但看见更多的还是练功房内一众小女生连哭带吼地压腿，弹奏弦乐的小孩无一不是老茧横生，门外的父母向他们加油打气，似乎已经看见了在舞台上独享荣光的艺术家。\n毕竟不是任何人都财大气粗到能为孩子泛泛而谈的兴趣爽快买单，如若将其换为可供炫耀与攀比的资本时，便拼了命也要将小孩往围城里送，开启另一个赛道的军备竞赛。林阿姨说她的外孙女从幼儿园起空闲时间就被女儿安排得密不透风，几乎是被拖着进辅导班的，兴趣成了累赘。她描述小孩拒绝上课而撒泼打滚的情形时倍感无奈，但我多希望那是幼年的我。\n《小别离》剧照\n进入中学后我培养兴趣的欲望依旧强烈，但被成山的试卷淹没。 成绩上不去，父母终于着急了，主动拿出一沓散钱带着我去交学费，只不过与我爱的绘画班擦肩而过，踏进了县城里与它分庭抗礼的补习班。当然这也有前提，那个优秀教师保证能在一学期内将我拉到班级中等位置。补习自然是有用的，学业明显好转后父母称这钱花得值，不像表姐一样学了古筝全打水漂。\n慢慢来到我的二十代，无论是自我介绍还是他人评价里关于“兴趣”都是空白。这道横线我空了许多年，最害怕别人问我你有什么爱好，也许对方只是随口一提，可我却咂摸出别的意味——这是对我整个人的评判。父母对兴趣的局限也传递给了我，他们混淆了爱好与才艺的区别，一项事物从感兴趣到擅长之间隔了天赋、金钱、时间、精力的距离。因此我对外宣称都是“没意思”，这个理由比没钱来得体面，比没时间来得更易拒绝，幼年时最活跃的兴趣心也就宣告夭折。\n《一起同过窗》剧照\n殊不知老年大学的几堂试听课下来，我消逝的爱好卷土重来，也许是与父母相隔甚远，也许是我经济自主，默默将朋友圈设为仅自己可见，更加叛逆地多报了两门课，这突如其来的逆反来自何种目的，我没有明确的答案。年末满20的我，算得上兴趣班“同学”的孙子辈，她们把我当作自家晚辈叮嘱各项事宜，课下有的关心学习，有的在意工作，有的询问感情状态，耳朵边就没闲过，而当音乐声再次响起时，那些耳鬓斑白的婆婆们立即归位，摇起花扇仔细听老师讲解转手动作。\n好友了解到我的近况后调侃道：“你对自己的课爱搭不理，倒是在养老班里过得津津有味，少走了几十年弯路！”这也不奇怪，老年大学里早八晚十与成绩评比都不存在，学习动机分外纯粹，书法老师告诉我，兴趣和许多事相关，唯独不排斥年纪，他教的学生里有母女有兄弟，年轻时大多困顿于生计，“爱好”这种锦上添花的事物犹为奢侈，年老了才能有点时间将自己作为自己的小孩来对待，可新鲜事物太多以至于眼花缭乱，浅尝辄止是常态，不过作为兴趣来说足够了。\n《亲爱的她们》剧照\n老年大学的氛围与年少时的辅导班截然相反，他们是主动进入到这所随时可离开的空城内，年轻与否、天赋与否、学成与否在热情面前都不是顾虑，于他们而言，兴趣本身就是一场游击战，遇见了就开始，没有合适的年纪。林阿姨和闺蜜相约要继续报网络写作课，即使是三分钟热度也坦然接受，丝毫不拧巴。她告诉我它还有个积极的名字叫探索，三分钟热度也有三分钟的收获，进一寸有进一寸的欢喜，兴趣而已，没那么多条条框框。","level1Selections":["L1_1_1","L1_1_2","L1_2_2","L1_3_3","L1_4_3","L1_4_4"],"level2Selections":["L2_1","L2_2"],"notes":"文章《100一学期，年轻人抢着上的“老年大学”有多香？》深度刻画了在老年大学背景下理想老年生活的特质，主要聚焦于**兴趣驱动的活力生活与丰富的情感联结**。\n\n首先，文章鲜明地展现了老年群体面对学习和生活的**积极心态 (L1_1_1)**。老年大学的学习氛围轻松愉悦，完全没有年轻时辅导班的功利性压力。文中提到，“三分钟热度也有三分钟的收获，进一寸有进一寸的欢喜，兴趣而已，没那么多条条框框。”这种**洒脱、不焦虑**的态度，让老年人能够纯粹地享受学习过程。林阿姨等老年人展现出的活力与耐心，也印证了这种积极的生活态度。\n\n其次，老年大学是实现**终身学习 (L1_2_2)**的重要场域。文章描述了舞蹈、书画、智能手机应用等多领域的丰富课程，老年人在这里主动获取新知识、新技能。这种学习是出于对兴趣的纯粹追求，而非功利目的，与作者年轻时被迫为“有用”而学习的经历形成鲜明对比。老年大学提供了一个让老年人有时间“将自己作为自己的小孩来对待”的机会，让他们重新拾起年轻时因生计或观念受限而放弃的爱好。\n\n再者，**朋辈社交 (L1_3_3)**在老年大学中占据核心地位。课堂上，老年学生们互帮互助，“有博大的胸怀和无限的耐心”，共同进步。课下，他们像家人一样关心彼此的生活，“耳朵边就没闲过”，构建了温暖、支持性的人际网络。这种紧密的朋辈关系，极大地丰富了他们的**情感生活**，使老年阶段成为一个“情感丰盈的圆满时节”。\n\n此外，**适老环境 (L1_4_3)**，特别是极低的学费（“一学期一百元”）、便利的设施和行政补助，为老年人提供了**低门槛、高性价比**的学习和社交平台。这使得**自主独立 (L1_1_2)**地选择和追求兴趣成为可能。文章也通过父母对“没用”爱好的否定，侧面反映了传统**文化环境 (L1_4_4)**对兴趣培养的限制，进一步凸显了老年大学在打破这些限制方面的积极作用。\n\n综上，该文章深刻阐释了老年大学如何赋能老年人开启一个**活力自主的“第二人生” (L2_1)**，并通过丰富的社交互动实现**情感丰盈的“圆满时节” (L2_2)**，让他们在晚年得以摆脱束缚，纯粹地追求个人兴趣和幸福。","highlights":[],"timestamp":1683648000000,"l1Names":["积极心态","自主独立","终身学习","朋辈社交","适老环境","文化环境"],"l2Names":["框架一：活力自主的“第二人生”","框架二：情感丰盈的“圆满时节”"],"dateStr":"2023/5/10"},{"uuid":"93e882c0-72fe-4b60-b25c-381d898b0907","title":"今年最感人的纪录片：当七八十岁的老年人也要恋爱","articleUrl":"https://www.lifeweek.com.cn/article/234761","content":"在纪录片《前浪》开始筹备的2022年，中国迈入了老年人口增长最快的时期。老龄化的加剧引发了社会层面的讨论和关注，在这些关于如何养老，如何保障老年人权益的议题中，“老年”往往被划分为一个特殊的群体，作为社会治理的客体而存在。\n但老年并不是骤然而至的。对于社会来说，老年人是一个需要扶养的庞大群体，但对于个人来说，衰老是一个必须经历的、缓慢下降的过程，是一个少有人知却又十分漫长的人生阶段。\n“老年”的抽象与神秘，是因为在公共场域中，真正老年人常常是失语的。而《前浪》试图真正走进老年人的中间，将镜头和话筒置放到每一个人具体真实的生活中，去看他们的故事，聆听他们的声音。\n镜头下的老人们有自己鲜明的性格与丰沛的生活，就像是先行者，带着观众去触碰那些即将或者终将到来的真实。\n文｜魏侨\n以下内容涉及剧透，请谨慎阅读\n看见我，听见我，知晓我\n2023年3月，腾讯视频尤里卡工作室制片人谢琳在上海电视台纪实人文频道公众号上看到了一篇拍摄手记，讲述的正是《前浪》第一集里在宜家拍摄老年人相亲故事的历程。尤里卡工作室已经做出过《十三邀》《解释鸿沟》等节目，始终关注着这个时代正在发生的公共议题，老年议题也是团队一直想要做的选题，于是谢琳辗转找到了《前浪》的拍摄团队。\n上海广播电视台纪录片中心范士广工作室此前拍出过感动无数观众的《人间世》，这一次他们将镜头对准了老年群体。“《前浪》最打动我的是，它核心不是在讲养老，而是在讲老。”谢琳说。于是在2023年9月，两个工作室达成合作，腾讯视频尤里卡工作室加入到《前浪》的制作和传播中来。\n两年的跟踪拍摄，14万余分钟的素材里，最终提炼出了7个主题，20余位老人的故事。他们的年纪最多的相差了二十余年，有的人追爱、学车、写作，仍然在积极地追求着新的意义，有的人在认知障碍中倔强地抗争，也有人笑对身体正在发生的不可逆的失控，还有人已经失去了自理能力，却依然努力地好好生活。\n上海徐汇区宜家的老年相亲角已经有着十几年的历史，几乎成为了城市文化的一部分。老年人，相亲。这两个听起来毫无关联的词语，在如今已经不是一个新奇的话题。伴随着社会老龄化的加剧，丧偶、独身老人的情感需求问题开始被正视。\n《前浪》在这里破题，把第一期命名为《不老爱神》。“爱情是我们第一个确定的选题，但是会拍到哪些人物，故事的落点在哪里，这些完全是不可知的。 ”在范士广看来，长久的拍摄历程，是逐渐打破刻板印象的过程。\n宝叔经历了三次婚姻被分走了三套房子，现在却依然一边说着“我们没有结果的”，一边热切地为一见钟情的“山口百惠（网名）”付出；玲玲和老张曾经是相亲角的一段佳话，却在80岁的时候选择分手，继续追寻下一段邂逅；金阿姨种花、做旗袍，咕噜噜地喝可乐，穿着带跟儿的白色小皮鞋爬山，碰见喜欢的人就立刻情不自禁地翩翩起舞。\n他们的热忱、自由打动了许多年轻观众，但这并不只是一个单纯地歌颂爱情美好，讲述老年人新生故事。就像宝叔一边追求“山口百惠”，一边积极地不断相亲；老张刚说了分手，还在玲玲家里就开始安排下一场见面，但每次相亲前还要去玲玲家吃饭。\n这些不仅与普遍认知的浪漫爱并不相符，甚至违背了基本的叙事逻辑。“我们被很多文学、电影给规训了，其实可能这才是一种回到生命最初状态，非常原始的爱。”范士广说。“老年人不会管叙事逻辑，可能复杂、混乱就是生活本身，我们想尽可能把生活的真实的东西展现出来。”\n“在七八十岁的年纪，毫不吝惜付出，勇敢追求感情是很酷和很勇敢的，但是故事的底色仍然还是点悲凉的。”在谢琳看来，《前浪》也从来不规避老年要面对的问题，“衰老就是一场不断的失去，你可能会失去自己的老伴，失去你对自己身体和大脑的把控。”\n《明天会更好》里95岁高龄，为了带老伴出门旅行而坚持学车的徐纬爷爷，最初分不清倒车入库和侧方停车，第三次科目二的考试依然失败了，《监护人》里的龚爷爷在一次又一次的认知测试里失败，直到去世也没能指定自己选择的刘大姐作为监护人，还有《洗澡》里，因为疾病而失能，只能由专业人员来完成洗澡的老人们，都在镜头下被真实地展现了出来。\n有人在衰老的泥塘里挣扎，也有人从容地接纳衰老。患有认知障碍的王敏华阿姨喜欢网购，但无论买回假货被儿女数落，还是最后在菜场丢了手机，她都始终乐观、积极地面对生活里的一切。范士广最初要给王敏华奶奶的故事取名《逆水行舟》，但一周之后又觉得这个名字不合适，“我凭什么要求一个老太太去跟衰老做斗争？人家活得挺顺从、挺开心的，一家人和和美美地生活不是挺好的吗？”最终《逆水行舟》变成了《顺水行舟》，似乎也代表着对于流行的价值观、刻板印象的打破。\n可能没有结局的故事，难以去定义的主角，无法用一句话去总结陈词的主题，是《前浪》呈现出来的故事形态。我们在其中既看到了身体的衰老、现实的残酷，也看到了热忱的生活、坚韧的抗争。“被看见是尊重的开始。”谢琳说，“看见真实的人，而不是被各种刻板印象浪漫化和粉饰过样子。无论是悲凉的、残酷的，还是热忱的、有力量的，都是其中的一部分。”\n老年应该是怎样的？或许原本就是个伪命题。故事里的老人们不再代表一个年龄、一个年代，而是遵循着自己内心的想法，在真实、具体地生活着。“还原到生活的本身，其实就是高级的。”范士广说。\n《前浪》播出后，一位观众的留言切中了范士广创作的初衷，“他说：看见我，听见我，知晓我。”\n镜头的背后\n《前浪》的拍摄团队几乎都是年轻人，最年轻的导演是“00后”，想要走到老年人中间，获得他们的信任，尽可能拍摄到最真实的素材，是一项漫长而艰难的工程。最初去到宜家相亲角，老人们对年轻的生面孔充满了敌意。“先是派了一个男导演去，一个礼拜就回来说不行，在那儿没人跟我说话。后来又派了一个女孩子过去，我就说你们以后也别来台里上班，就在宜家待着。”范士广说。\n导演们在宜家喝咖啡、吃饭，偶尔聊天，没有目的地“混着”，直到三个月之后，老人们开始问“那些年轻人来了吗？”他们才第一次把摄像机拿出来。\n在宜家主创们采访了36个老人，宝叔是第一个确定要拍的人物。他是这里万众瞩目的明星，因为热情又慷慨，常常都带着一大箱零食水果和饮料出场，十分享受被大家围绕的感觉。当工作人员去到他家里拍摄时，他自然而然地在锅里煮了六个鸡蛋，导演在拍摄手记中写，“他并不知道我们拍他一个人的早餐敲六个蛋是不合理的，他只是单纯地想给我们做早餐吃。”\n在老人们的认知里，来者是客，应该保持基本的礼貌，几乎每一个导演都被自己的拍摄对象招待过，有的人不停地送吃的，也有许多人一次又一次打开自己的相册，给工作人员讲起自己过去的故事。“其实很多老年人生活就是吃饭，睡觉，听听广播，看看电视，甚至就是枯坐。他们知道你是电视台的记者，总是觉得你来了之后我得能够给予你点什么。”\n一年多的拍摄时间里，主创和老人们形成了独特的交流方式，他们一起吃饭，一起买东西，一起生活，彼此陪伴，年轻人们的到来成了老人们新的期待。每次离开时，王敏华阿姨总是会问下次什么时候来，而《爱人》中的申阿姨，则在日历上工整地标上“神仙来访”或者“神仙傍晚到”，是因为导演金翔的微信名叫“JX要做神仙”。\n在长久的陪伴里，镜头记录下了老人们的不同侧面，比如阿宝坐在家里用手机斗地主，一个人睡着了，醒来以后打电话，朋友因为雨天拒绝了出门，于是他一个人去吃馄饨，又一个人打着伞去了宜家。再比如徐纬爷爷坐在家里一边念口诀，一边对着空气打方向盘，就像和风车搏斗的堂吉诃德一样。还有《洗澡》中的华鹤定爷爷，罹患帕金森症卧床两年，时常跟天猫精灵聊天，他们聊国际形势，也聊退休工资，甚至问人工智能“你们那里谈恋爱吗？”每个问答充满了奇遇感。\n甚至《爱人》的故事原本不在计划中，是在这样的相处过程中生发出来的，跌宕起伏，几经反转。一开始去上海精神卫生中心的老年门诊，主创们是想要寻找关于阿尔兹海默症的故事，碰上了申阿姨一家。申阿姨和罹患阿尔兹海默症的老伴难舍难分，似乎让人看到了一个质朴凄美的爱情故事。可在老伴骤然去世之后，申阿姨却突然告诉导演，“你知道吗？我一辈子都不喜欢他。”\n没有人知道申阿姨再说这句话时的真实心情，就像很长一段时间内也没有人能够锚定这个故事的落点，直到申阿姨在书中读到“鸡虫得失无了时，注目寒江倚山阁”，坚定地说“我是这么认为的”。这是杜甫很少被提及的一首诗，却又在无比细腻的生活细节中呈现出对于世事的洞悉。“没有什么时候能结束这个问题，但最后是要注目寒江，看得开阔一些。”她说。\n老年是处境，生活是选择，点点滴滴的细节，汇聚起最真实的故事，超越所有的预设和编排。“我一直觉得纪录片的拍摄其实是一个相互奔赴的感觉，拍得好与坏有很多时候和导演的关系并不是特别大，其中80%的功劳都是运气，是因为遇到了好的拍摄对象，有一个很好的故事，完全把他自己的生活敞开给你拍。”范士广感叹道。\n好好生活\n《前浪》播出前，主创们试图联系参与拍摄的老人们，只有王敏华阿姨和家人一起看了成片，儿女们很开心地说“回头请你们吃饭”，王敏华阿姨则提出把“阿尔兹海默症”改成“老年认知障碍”，不想让自己被认为是“痴呆”。\n徐纬爷爷住进了养老院，但他依然固执地追求自由，隔三差五就逃出养老院，偷跑回家，自己做饭自己干家务，一个人住上一个礼拜，再回去看看老伴。\n风风火火的宝叔已经联系不上，导演听说他找到了新的女朋友，比他年轻许多。再次联系上金阿姨的时候她因为脑梗已经住院了，但旁边床位的病友认出了她，问“你是不是《前浪》里面的那个主人公了，你住院了？ ”\n生活仍然在继续，而《前浪》的影响力在持续、缓慢地扩散，很长一段时间里，范士广收到许多身边亲人朋友的反馈，让他感到惊讶的是有很大一部分是来自父母辈的，“过去纪录片的观众大部分是年轻人，但这次有很多老年观众。我身边的我妈的很多朋友，在看《前浪》的时候看到了我的名字，来找到我妈。很多老年人他们真的看完了，觉得拍得很真实。”这种真实感，也让在屏幕前观看的千千万万老年人感受到“被看见”。\n与此同时，有年轻观众评论说“对后浪而言，这部《前浪》来得恰到好处。”在纪录片上线后，主创团队做了一组海报，“一起看见《前浪》，也看见此刻的我们。没有代沟，都是代入。”无论是在相亲角寻觅合适的伴侣，还是通过学车的方式在把握人生的方向，片中讲述的问题，并不孤立地存在于老年，而是贯穿一生的议题。\n“每个人都会遇到相似的问题，真实的故事产生的共鸣感， 会让你获得很大的力量。”谢琳说。\n纪录片的篇幅有限，许多珍贵的镜头与故事无法在一个小时的片长中完整地呈现出来，于是谢琳给每个主题做了一套文字稿件。稿子里描述了老张过去给年幼外孙女买娃娃，没有送出去，但自己却迷恋上了买娃娃，他给每一个娃娃取名字，买衣服打扮它们，寄托难以与他人言说的情绪。观众还能在稿子里看到被砍掉的故事：61岁的钱女士在家里撞上扶手、电动升降床，置办了各种监测仪器，为了照顾父母把自己的家改造成了养老院。\n文字可以置放更丰富的细节，更深入的内心自白，也有更广阔的延伸空间。《监护人》里当人民调解员提出了一个考验性的假设：“如果老爷子生病，需要的金钱数额很大，高于老人的资产和收入，你也准备出？”龚爷爷和刘大姐都无法反驳这个问题，但当谢琳找到法学专业的教授咨询时，才得知根据《民法典》条例，意定监护人并不一并承担法定赡养义务。\n针对阿尔茨海默症患者的问题，谢琳请了协和医院的主任，更细致、专业地探讨老年人在病程中末期应该如何去照护，并且提出了社会层面上“喘息服务”的必要性。“我觉得我们让大家看见了这些困境，也有责任给出一个专业的参考，引导大家去更好的去理解这些问题，当遇到相似的困境时有据可查。这也是我在传播上非常看重的地方。”谢琳说。\n“就像文学的目的都是为了让我们好好地生活，纪录片也是这样。”范士广说，“做纪录片让我们不断通过创作，通过和他人的沟通接触，走出自己比较狭窄、匮乏的世界，去理解更宽阔的世界。也是我希望能够给观众的一个感受，让大家对他人有更多的体谅和理解。”\n从《人间世》到《前浪》，范士广和团队始终在这条道路上前行着。“看了那么多老年人的家庭，后边都是中年人在默默支撑着他们，接下来我想做中年人的故事。”他说，“中年人的难可能是更难以言说的，但那一部分可能才是一个作品最好的、最有意义的表达。 ”","level1Selections":["L1_1_1","L1_1_2","L1_1_4","L1_2_1","L1_2_2","L1_2_3","L1_3_1","L1_3_2","L1_3_3","L1_4_2","L1_4_3","L1_4_4","L1_5_1","L1_5_3"],"level2Selections":["L2_1","L2_2","L2_3","L2_4"],"notes":"这篇关于纪录片《前浪》的文章深刻揭示了当下老年生活的多元面貌，打破了传统对老年的刻板印象。文章首先强调了老年人作为“社会治理的客体”的固有视角，并提出纪录片旨在展现“真实的人”，而非“被各种刻板印象浪漫化和粉饰过样子”，这直接关联到对**文化环境**的批判与重塑（L1_4_4）。 文中描绘的老年人，如宝叔、玲玲、金阿姨等，在七八十岁高龄依然“追爱、学车、写作”，积极追求新的意义，展现了强烈的**积极心态**（L1_1_1）和**自主独立**（L1_1_2），印证了**活力自主的“第二人生”**（L2_1）框架。他们“毫不吝惜付出，勇敢追求感情”，甚至“80岁的时候选择分手，继续追寻下一段邂逅”，这不仅是**亲密关系**（L1_3_1）的体现，更是对个人意愿的尊重。徐纬爷爷为带老伴旅行而坚持**终身学习**（L1_2_2）学车，以及王敏华阿姨“从容地接纳衰老”（L1_1_4）并保持乐观，也体现了老年人内在的活力。 其次，文章着重描绘了老年人的**情感丰盈**，尤其是在“老年相亲角”中对爱情的渴望和实践。无论是宝叔对“山口百惠”的热切付出，还是申阿姨复杂的情感自白，都展现了老年人“回到生命最初状态，非常原始的爱”，这与**情感丰盈的“圆满时节”**（L2_2）相契合。此外，主创团队与老人们建立的**朋辈社交**（L1_3_3）——如“神仙来访”的标注，也凸显了陪伴和联结的重要性。 科技在老年生活中扮演了重要角色，王敏华阿姨的**网购**，阿宝**手机斗地主**，华鹤定爷爷与**天猫精灵聊天**，这些细节都展现了**科技赋能的“现代晚年”**（L2_4）的场景（L1_4_2）。 然而，文章并未回避衰老带来的**挑战与应对**（L1_5_3），如徐纬爷爷学车失败、龚爷爷认知障碍，以及因疾病失能的老人。但这些困境往往伴随着积极的应对方式，如王敏华阿姨的乐观，和纪录片希望通过专业参考提供**未来规划**（L1_5_1）和解决思路，这与**未雨绸缪的“规划项目”**（L2_3）框架呼应。文中还提及了**适老环境**改造（L1_4_3）和子女**代际关系**中“中年人在默默支撑着他们”的现象（L1_3_2）。总体而言，文章通过多维度叙事，有力地呼吁社会“看见真实的人”，促进对老年群体的“体谅和理解”（L1_4_4）。","highlights":[],"timestamp":1724947200000,"l1Names":["积极心态","自主独立","接纳衰老","社会参与","终身学习","休闲娱乐","亲密关系","代际关系","朋辈社交","科技赋能","适老环境","文化环境","未来规划","挑战与应对"],"l2Names":["框架一：活力自主的“第二人生”","框架二：情感丰盈的“圆满时节”","框架三：未雨绸缪的“规划项目”","框架四：科技赋能的“现代晚年”"],"dateStr":"2024/8/30"},{"uuid":"82ac575f-e202-43e4-83f8-7d0f37a8a010","title":"老年人的爱情：“直到死亡将我们分开”也不算多重的...","articleUrl":"https://www.lifeweek.com.cn/article/81665","content":"在我们这个年龄，“直到死亡将我们分开”，也算不上多重的承诺。\n玛戈特是在肯的葬礼上回忆起他这句话的。订婚的时候，他们俩加起来刚好140岁。\n看完《现代爱情》之后的很长时间，我都还会想起最后一集里的这句话。\n和其他几集相比，玛戈特和肯的故事非常短，短到几乎全部都写在一段悼词里了，但它格外让人羡慕。\n他们相爱，他们旅行，他们在一起改造房子，他会叫她“亲爱的”，如果他们晚上一起出去，她只需在屋子里扫一眼，肯就凭直觉知道该带她回家了。然后他们会坐在浴缸边上，用牙线洁牙，八卦晚上发生的各种事。每次他们在房子里擦肩而过的时候，他一定会停下来吻她，或捏捏她的肩，或摸一下她的手。玛戈特说，老年人的爱情不一样，但也一样。因为年轻人做的所有事她和肯都会做。\n她说的没错。这些的确是我们总以为年轻人才会做的事，想象着年轻人都会做的事，但事实上，只要在房间里擦肩而过就接吻？这恐怕是大多数一起走入庸常生活的年轻人对生活的憧憬和想象才对吧？\n85岁的时候，我的奶奶恋爱了。我之所以说是恋爱，而没有说她只是找了个新的老伴儿，是因为她的一句话。她对我说：“我们俩说好了，在一起就是一辈子。”我听过太多人说这样的话，每个人说的时候都会带着几分天真，也包括我的奶奶。我始终记得她当时的神情，就像一个少女。\n我的奶奶是个典型的山东老太太，独立，要强，倔强，从不在别人面前表现出脆弱的一面，爷爷去世后，在她身上能看出的变化只有消瘦。她不愿意住进任何一个儿女的房子，不希望自己改变他们的生活。很长的一段时间，只有我和奶奶住在一起，白天的时候，她一切如常，但是到了夜里，她的房间里就会传出抽泣的声音。我很少能鼓起勇气安慰，更多的时候，是在隔壁的房间里不知所措。\n我们经常会给郁郁寡欢的朋友支招儿——失眠？谈场恋爱就好了。没食欲？找个女朋友就好了。家里没来暖气？找个男朋友就不冷了。但我们几乎不会想到把包治百病的“恋爱”当成药方儿开给任何一位老人。不得不承认，即便我们相信老年人之间可以有爱情，也很少会真的认为他们需要爱情，更不会去想象他们的恋爱。\n后来，奶奶开始经常去公园儿，她就是在那儿认识冯爷爷的，我们在背后叫他“老冯”。那段时间，她笃定要找个伴儿，因为儿女对她发出的邀请越来越频繁，虽然身体很好，生活可以自理，但家里人认为，她终归到了需要有人时时陪在身边的年纪。所以，我其实并不认为他们的相遇是多浪漫的事情，奶奶一开始寻找的可能只是一个不进入儿女生活的理由。\n他们并不是玛戈特和肯那样的恋人，至少他们不会一起坐在浴缸旁边，一边用牙线一边聊天儿——奶奶已经满口假牙了，每天晚上把牙摘掉，她脸上的线条就会瞬间松垮下来，显出一副真正的老态，每当这个时候，吐字也就没那么清晰了，老冯虽然没有假牙，但也没几颗真牙了。所以，即便他们有聊不完的话，画面也不可能是美剧里的那种美。\n当然，他们在一起的时候也很美。我的奶奶个头儿很小，过了80岁，她就开始有些微微地驼背，过去一个人出门买菜，她总是推着个小车儿，走起来，背就显得更驼了。老冯年纪和她差不多，但个儿高，身板儿挺拔。一起出门的时候，他总是一手拎着购物袋，一手领着奶奶，有一次，我在楼下遇到他们，看着两个人从路的尽头远远地走来，就像一个高大的父亲领着一个小女孩儿。奶奶耳背，老冯就得当她的耳朵，过马路，接电话，都得在一边儿帮衬着。奶奶当然也得照顾老冯，给他做没牙也能吃得下的饭菜。\n和我的爷爷相比，老冯实在显得太普通了，他的气质和谈吐不够迷人，也没有什么值得炫耀的过去。他和我的奶奶总是聊着两个不同的世界，但奇怪的是，他们却总是有话说。更重要的是，他让我看到了一个和以前不一样的奶奶。\n在没有老冯之前，我的奶奶就是宽容、忍让、聪明、能干的代言人，操持家里所有的事情，对爷爷照顾的无微不至，我从没见她发过脾气，也从没有听过她任何抱怨。可是和老冯在一起，她总是被“投诉”。老冯会时不时一脸委屈地跟我诉苦，“你奶奶脾气大，她老说我。”“我不去那个公园了，你奶奶不高兴。”奶奶看他“告状”，也不反驳，只是向我们扔来嗔怪的一瞥。我总是忍不住大笑，奶奶如今90岁了，却变得越来越像个孩子。\n玛戈特说，她和肯相遇的时候，已经经历了足够多的人生起伏，学会了如何妥协，已经挺过了错误和失去。我的奶奶和老冯大概也是如此。玛戈特和肯在跑步中相遇，一开始肯追逐她，后来她追逐肯，直到他们终于找到一致的步调。我的奶奶和老冯呢，一个聊东，一个谈西，总是听的我云里雾里，但是他们最终还是能哈哈哈地笑着说回到一件事儿上去。\n老年人的爱情一样，但也不一样。他们从一开始就要直视我们在一段感情里避而不谈的注定的分离。因此会自嘲，在他们的年龄，即便说“直到死亡将我们分开”，也算不上多重的承诺，因此奶奶在说“一辈子”的时候，说不定心里也盘算过一个数字。\n在肯的葬礼上，玛戈特说，他们曾经以为，如果他们的这段关系失败了，他们也能挺过去。但是此刻，她没有那么肯定了。当肯率先跑完了他的全程，她不得不开始自己的长途跋涉，她不知道该如何继续她的生活。\n第2季《奇遇人生》最新的一集里，周迅和阿雅跟着日本老人道子一起去医院探望她得了阿兹海默症的老伴儿幸贞先生。幸贞看起来过得很开心，用力的拍手，大声的唱歌。后来，阿雅微笑着问了他一个问题：坐在旁边这位漂亮的女士，你知道她是谁吗？他很小声地说了一句，不知道。我不喜欢阿雅的提问，她显然想要挑明这对相爱的老人紧靠在一起却正在面对的分离。只不过谁也没有想到，幸贞唱着歌再次回答了这个问题：“喜欢春天的人儿是，心地纯洁的人，像跨越岩石的海涅一样，是我的恋人。”道子微微低下头，微笑着说：“他说，是我的恋人。”","level1Selections":["L1_1_1","L1_1_2","L1_1_4","L1_2_3","L1_3_1","L1_3_2","L1_4_4"],"level2Selections":["L2_1","L2_2"],"notes":"文章以老年人的爱情为核心，深入探讨了其独特面貌与社会认知。首先，文章通过玛戈特和肯的浪漫故事，以及作者奶奶与老冯的平实相守，生动展现了老年人**亲密关系 (L1_3_1)**的丰富性和深刻性。玛戈特指出“年轻人做的所有事她和肯都会做”，直接挑战了社会对老年人情感生活的**刻板印象**，体现出老年群体在**文化环境 (L1_4_4)**中追求情感满足的权利。作者奶奶在85岁时恋爱，“像一个少女”般神情，以及恋爱后“越来越像个孩子”的情感释放，都强烈表达了老年人拥有的**积极心态 (L1_1_1)**和焕发新生的活力，这与**活力自主的“第二人生” (L2_1)**框架高度契合。文章还强调了老年人追求**自主独立 (L1_1_2)**的强烈愿望，例如奶奶不愿“住进任何一个儿女的房子”，并以找伴儿作为“不进入儿女生活的理由”，这反映了他们在**代际关系 (L1_3_2)**中寻求自我掌控的努力。同时，文章也坦然地呈现了老年爱情中**接纳衰老 (L1_1_4)**的现实，如面对身体变化（假牙）和生命的有限性（“直到死亡将我们分开”），这些细节使得老年爱情显得更为真实和动人。虽然没有刻意的“休闲娱乐”，但爱情本身就是一种重要的**休闲娱乐 (L1_2_3)**形式。最终，道子和幸贞的故事，即使面对阿尔茨海默症带来的记忆消退，幸贞依然能本能地唱出“是我的恋人”，这升华了老年爱情超越物质和记忆的深刻联结，完美诠释了**情感丰盈的“圆满时节” (L2_2)**这一框架，即老年是情感需求得到充分满足的时期，追求内心的温暖与充实。","highlights":[],"timestamp":1574438400000,"l1Names":["积极心态","自主独立","接纳衰老","休闲娱乐","亲密关系","代际关系","文化环境"],"l2Names":["框架一：活力自主的“第二人生”","框架二：情感丰盈的“圆满时节”"],"dateStr":"2019/11/23"},{"uuid":"eb747edc-8b44-4414-8bb7-31191007aac5","title":"“理想八旬”的生活什么样？","articleUrl":"https://www.lifeweek.com.cn/article/226104","content":"已过完八十大寿，但刘玉兰的脚步依然轻快，嗓门洪亮。刘阿姨毕业于哈工大，在中建一局搞了一辈子建筑。她是典型的东北“社牛”，一路走南闯北，国外也走了三十多个国家，现学了英语三百句，就能蹦着单词和老外聊得热火朝天。\n很多老人“退休”后，整天“休”息，反而“退”化——窝在沙发里看电视看手机，身体机能反而更快衰退。刘阿姨现在每天都很忙碌，她每周要做三次八段锦、三次经络操、打三次门球。她不仅担任“五月花”门球队的队长，教新手、带队员，还担任着燕园的居民代表，为养老社区的优化出谋划策。\n当时73岁的刘玉兰赴北极圈旅游、探险\n刘玉兰的老伴儿是她的大学同学，十年前去世了，之后她一直自己生活。两个儿子想让妈妈跟自己住，但刘阿姨自在惯了，也不认同“养儿是为了防老”的想法。后来儿子的朋友推荐了泰康之家·燕园，刘阿姨实地探访后，发现燕园的居民素质很高，“可以说‘谈笑有鸿儒，往来无白丁’”，立即开开心心地住了进去。\n泰康之家·燕园是泰康保险集团在全国投入运营的第一个医养结合的养老机构，于2015年开业。而早在2007年，泰康保险集团创始人、董事长兼首席执行官陈东升就开始了探索养老之道。只因他在自己母亲身上看到了中国老人身上“难以克服”的节俭和传统——尽管家里条件已经相当不错，但从匮乏时代一路过来的老人，保留着很多顽固的习惯：家里看过的报纸、喝过的可乐瓶，都收起来卖废品；好吃的要留给孙子，对自己一省再省。他认为，中国老年人的生活方式和对生命的态度急需一场“养老革命”来改变。经过十多年的用心经营，他当年头脑中的蓝图正在变成现实。\n泰康之家·燕园\n泰康之家·燕园的常见场景与大众对传统养老机构的刻板印象颇为不同：下午三点钟，燕园活力中心的跑步机都被占满了，满头华发的阿姨们正在跑步机上快步走，身姿挺拔，步履轻健；椭圆机则被四位爷爷占据，双腿用力地蹬踏着。即便坐着轮椅的老人，也会在运动健康指导师的陪伴下，做着运动，整体呈现一种蓬勃的活力。\n在泰康之家的养老社区，有专人定时做保洁；有优秀厨师和营养师联手打造美味餐食；有一群“专职儿女”服务日常生活。这让刘玉兰有时间做更多自己喜欢的事。而她最喜欢的一点是：自由。“想干嘛就干嘛，想睡个懒觉，睡到几点都没人管你。”\n泰康之家主张的养老哲学是：“养老要忙养，而不能闲养”。活动部会设计很多精彩活动，它是燕园的核心部门之一，员工学历较高，很多是养老服务科班出身，擅长设计适合老年人的各种文化活动。但这里更多的课程和俱乐部都是居民自己自发组织的，老人们在这里发挥余热，进行着“银发价值再创造”。\n在燕园的乐泰学院，现在有40多门课程、近40个俱乐部，包括民歌合唱队、歌剧小组、腰鼓队、京剧组、配音秀、电吹管小组……甚至还开设过冷门的世界语课。出于预防阿尔茨海默病的目的，数独、桥牌、围棋、掼蛋等益智游戏，在这里很受欢迎。\n老人们会不定期开展各类文娱活动\n著名导演郑洞天也是泰康之家·燕园的居民，他长期在燕园主持电影沙龙，居民们会一起参与关于电影的讨论，影评水准很高，比如诺兰神作《奥本海默》放映后，在场讨论的燕园居民中就有五位物理学家，不仅评论剧情，还涉及到学界泰斗的雅闻轶事以及高深的前沿理论。\n更有“重头戏”燕园科技讲堂，不仅有在燕园生活的院士、教授经常做科普；还会邀请社会上的知名专家学者做讲座；也有老人退休后，开辟出研究新赛道，为大家做分享。长辈们相互链接、相互引领，激发了内在活力。\n宋建云是燕园科技讲堂的服务组成员，为很多讲座出谋划策。此外，作为一位“杂家”，他也曾通过一些课程和讲座，与邻居交流，包括数独讲解、“回望宋朝”讲座以及读书分享等等。他还基于自己的理财实践经验，给燕园的居民讲过“理财系列课”。说起理财，他拿选择养老机构的决策过程举例：在入住燕园之前，他考察过很多养老机构，但原则上是更多地去看保险公司的养老社区，看房地产商兴办的养老社区则比较少。\n宋建云在分享自己的读书心得\n宋建云的逻辑是，养老社区是重资产，前期投入很大，一般要八到十年才可能盈利，一般房地产商的“负债期限和成本”决定了他们总有一种“卖房”冲动，让人担心买断长期居住权之后，后期服务是否能依然保持期初的水准。而保险公司的保险负债期限长，和养老社区的资产能更匹配，按月收费模式也让长期服务质量更有保证。“再一个，保险公司有银保监会监管，不能轻易倒闭，所以安全性会更好一些。”宋建云说道。\n当前国内保险公司的养老社区大多也是轻重商业模式并举，宋建云判断道：“泰康选择了重资产模式，当然会更坚持长期主义。”\n医养结合为幸福晚年托底\n很多长辈刚入住到燕园时，是坐着轮椅来的，比如郑洞天导演。他曾谈到：“我是被轮椅推进来（燕园）的。当时我有很严重的心脏病，但在燕园居住两年后，我的生活竟然可以完全自理了。下楼就能看病、随时有医生可找，是最重要的一点。医养结合也是泰康之家最显著的特点。”燕园居民们之所以能畅享“理想八旬”的生活，是有泰康的医养体系在托底。\n每一位入住燕园的老人，都会经历专业评估、确定照护等级及入住业态、设定照护目标、制定照护方案等标准流程。身体、精神状态较好，生活能够完全自理的长辈会入住到“活力区”，也就是独立生活区；如果是失能、部分失能以及失智长者，则会入住“护理公寓”，专业护理团队依据泰康国际标准长期照护体系（TK-LTC）提供兼顾生活照料及医疗护理的照护服务。\n滑动查看更多\n泰康之家·燕园的环境与设施\n在泰康之家，“1+N”多学科团队实时在线，不仅有管家、社工和个案管理师作为“专职儿女”贴心照顾，还有医生、护士、康复、护理、药师、文娱、餐饮、运动、运保等多学科团队的专业人员配合支持，从换灯泡到教老人用智能手机，从陪长辈聊天到为长辈领药、送医，从文娱活动到运动康复，长辈的需求都能得到及时响应，并提供不同专业角度的高品质服务。\n工程队检查、维修社区设备\n表演艺术家于洋与妻子杨静是电影圈著名的恩爱伉俪，2018年10月，将近90岁高龄的夫妇俩选择来燕园安享晚年。\n在燕园护理公寓，于老夫妇每天的生活有专业有素的护理师帮助打理：护士早晚监测血压、血糖；不舒服了，在房间里一拉绳就可以呼叫医生；餐饮服务团队制作科学营养的餐品，每餐送到餐桌；每天的康复治疗课可以延缓功能退化；文娱活动让两位老人开心快乐……\n于洋与妻子杨静已相伴70余载，始终情深意笃\n燕园的专业服务给于老的女儿于静江带来了诸多惊喜，“有时候我们越是对自己最近的亲人越没有耐心，但是在燕园，护理团队做到了有耐心、有爱心、有责任心，这种‘三心’服务是我们子女有时候也无法完全做到的。”\n八九十岁老人的子女往往年纪也很大，他们带父母看病，排队、拿药、检查、缴费、住院，每个步骤都是过关，于静江就心有余悸地说：每次带父母去医院看病都得掉一层皮。\n而燕园社区有自己的二级康复医院——泰康燕园康复医院，楼上楼下走几步就到了，拿药看病都很方便，“这不是一般的养老机构能做到的，我感觉甚至比一些‘高干病房’还要好。”于静江说道。医养模式是泰康之家的独特优势，通过“一个社区、一家医院”的创新医养融合模式，为居民打造“家门口的医院”，无论是突发急救，还是日常的健康管理，都有专业的医护团队实时在线。\n老人在康复师的指导下进行锻炼，医养融合模式让老人们的健康更有保障\n泰康之家的医疗体系坚持防大于治。刘玉兰对燕园的“慢病管理”非常推崇，家庭医生会根据老人的身体状况，提供健康建议、进行慢病管理。泰康之家通过各种精准化管理提高老人生活质量，截至目前，在泰康之家内分泌医学首席专家、亚洲糖尿病学会副主席杨文英教授的带领下，燕园康复医院糖尿病管理中心已帮助600多位长辈平稳控制血糖，随访1年后空腹血糖达标率80%以上，糖化血红蛋白达标率大于70%。\n除了慢病管理，燕园的急救体系也非常强大。泰康之家老年医学及急诊医学首席专家、中国老年医学学会高血压分会委员付研，原是北京同仁医院急诊科主任，她最擅长的就是老年急诊急救。\n泰康之家的急救系统突出的就是：“快”。每个房间都配备拉绳警报装置，当老人身体不舒服，或者社区的工作人员发现老人身体出了问题，就能立刻拉响警报。收到报警后，医生和护士会抓起急救箱奔向现场，救命的装备早已分门别类地放好；到现场后进行抢救操作；管家作为老人的“专职儿女”，也会第一时间出现；同时保安也会到场，助力维持秩序、抬担架、推车等事宜。这个四合一团队守护老人健康，为抢救生命而争分夺秒。\n中风、窒息、严重心律失常、急性器官衰竭都可能在短时间内威胁老人生命安全，抢救越及时效果越好，医疗花费也越少。\n付研最近抢救的是一位89岁的老奶奶。这位长辈平时身体很好，前几天突然间觉得不舒服，立即拉绳。老人被送到燕园康复医院的抢救室，检查发现是急性下壁心肌梗死。当即紧急启动北大国际医院急诊科的“绿色通道”，“上了手术台后，室颤了6次，冠脉被堵得死死的，幸因抢救及时，长辈现已康复。”\n付研（左一）团队的医疗急救，为老人们的健康增添了重要保障\n85岁的老爷子郭莹曾在2020年7月和9月做了肠癌和肠梗阻两个大手术并且禁食禁水50天后，体重比手术之前减少了整整36斤……身体弱到走路都走不动了。经过了燕园医生、厨师、营养师的合力护航，“今天的我红光满面，底气十足，所以我特别要感谢燕园，对我有再造之恩。”说到此处85岁的郭老爷子声音哽咽，眼角泛起泪花。\n康复后的郭莹老人在表达心声\n经过管家、护理师、营养师等“专职儿女”们专业系统的照护，有的老人由医院的常客变为稀客；有的老人体重由出院时的80斤，增重20多斤。\n“1+N”多学科团队中的重要一环是护理师，他们会协助照护区的老人起床穿衣、如厕洗澡、打餐送餐、就医康复、恢复性锻炼……长时间的朝夕相处，彼此的感情很深。\n资深护理师董明明说道：“很多护理师觉得‘这个工作平凡而伟大’。”他们通过自身的专业性和情感付出，为老人们的幸福晚年持续护航。于老的女儿于静江将这一切看在眼里，也诚恳地称赞：“泰康之家的护理服务在国内来讲是可以拔头筹的。”\n养老社区正在批量化复制\n泰康之家的养老社区在设计建造之初就采用了“适老化”思维，走在园内，随处可以看到适老化的细节：每个房间的鞋凳、马桶、浴室都是适老化定制的；茶几边缘呈弧形上翘，避免药片滚落到地上，老人去捡时发生危险；电梯内有扶手且开关比较慢；风雨连廊在天气不好时也能方便老人出行，避免滑倒骨折。\n泰康之家在细节中处处体现了对老人的用心和照护\n设备和硬件上的用心，同样体现在“软性”的服务上。陈东升反复强调：服务品质是泰康之家未来保持长期稳定核心竞争力、打造养老品牌最核心的一点。”从2023年开始，泰康之家的服务再次升级，进入2.0时代。\n高品质服务的核心是人。泰康之家和多所高校联合培养，在高校设立“泰康班\"，以此解决高水平护理的“人才荒”。经过专业培养，这些新一代护理师具备成熟的职业素养、价值观，同时也有一颗照护长辈的心。\n泰康之家还构建了多种渠道并行的意见反馈系统，刘玉兰和宋建云都表示：“我们提意见很多，是社区的‘意见’大王，也常常有邻居要求我们代表他们反映意见与建议。”每个泰康之家居民的房间内，有一部大字版的电话，一键就能投诉，而且是直接投诉到泰康保险集团的95522客服团队，反馈更加快捷。在反馈系统的千锤百炼之下，适老化和各项服务持续精进。\n泰康之家总部专门成立了“服务与质量综合评定”检查组，共有几百条检查标准，以此考核一线的社区管理团队，保证了服务品质的标准化和品质稳定，从顶层设计上把控服务品质。\n一线服务人员会及时为老人们答疑解惑、提供帮助\n运营九年来的成功经验，也被梳理汇编为一本轻量级的服务标准手册，新入职的服务一线员工，可以拿着标准手册按图索骥自学，快速拉齐泰康的服务标准。\n这一套服务提升的组合拳，很快见到成效。据泰康之家助理总裁兼首席运营官张惠丰介绍：“2023年，我们的客户服务满意度创了历史新高。”\n《经济学人》2023年曾刊发封面文章《活到120岁已经成为一个可以想象的前景》，介绍当代科技对寿命的种种加持。而有了医药科技、人工智能和高水平养老服务做依托，在医养体系的全程护航下，健康且高质量的长寿变得更常见。\n目前泰康之家的入住居民中，不少人是共和国建设者，不乏院士、大学校长、知名专家、艺术家、大企业高管等，具有一定社会影响力的居民超1100 人，其中活力居民平均年龄是82.3岁；护理区的居民平均年龄是85岁，远超中国人均预期寿命。\n与此同时，泰康之家这种养老社区，正在批量化复制。包括已经开业的20家在内，泰康在全国布局了35城40个项目，目前已经入住了超12000名居民，全部建成后将可容纳8.5万名老人。\n老人们在泰康之家养老社区自在地安享晚年\n老人在养老社区享受晚年的同时，也在进行着“银发经济再创造”：钱理群教授是燕园的第一批居民，76岁后出版了14本书，再次掀起创作高潮；建筑大师梁思成的弟子钮薇娜，用“建筑工程进度表”的方式解读宋词，95岁的年龄开始直播，成为网红奶奶……\n刘玉兰现在每天除了玩，就是健身、听讲座、读书、写诗、酝酿写回忆录。她在燕园结交了几个新闺蜜，大家教育程度、经历背景相似，很有共同语言。泰康之家在全国是连锁运营模式，老人们未来准备开启旅居式养老：“阳春三月到苏杭体会‘姑苏城外寒山寺，夜半钟声到客船’的意境；冬天去大理感受‘洱海月映苍山雪，下关风吹上关花’之美；雨季时去重庆玩味‘君问归期未有期，巴山夜雨涨秋池’的诗意……”刘阿姨描绘着自己的构想，趁着现在身体较好，准备立即行动起来。\n刘玉兰和好友们一起参加活动\n作家渡边淳一曾谈到：人生最后二十年的活法，是决定一个人这辈子是否活得精彩的关键所在。刘玉兰深表认同，她补充道：“人生的智慧之火不能熄。对老年人来说，到泰康之家，是另一个春天的开始。”\n老人们的人生后程，不再是常见的“攒瓶子、带孙子”，而是自由、轻松、美好，为人生书写出一个漂亮的结尾。","level1Selections":["L1_1_1","L1_1_2","L1_1_3","L1_2_1","L1_2_2","L1_2_3","L1_2_4","L1_3_3","L1_4_2","L1_4_3","L1_4_4","L1_5_1","L1_5_2"],"level2Selections":["L2_1","L2_2","L2_3","L2_4"],"notes":"文章“理想八旬”的生活什么样？”通过泰康之家·燕园及其居民的案例，描绘了一个多维度、高品质的理想老年生活图景。核心在于突出**活力自主的“第二人生” (L2_1)** 的理念。刘玉兰作为主要**成功典范 (L1_5_2)**，其73岁赴北极探险、学习英语、积极参与门球队和社区事务，甚至规划“旅居式养老”的行为，充分展现了**积极心态 (L1_1_1)**、**自主独立 (L1_1_2)** 和追求**休闲娱乐 (L1_2_3)** 的特质。泰康之家“养老要忙养，而不能闲养”的哲学，以及鼓励居民**社会参与 (L1_2_1)**、**终身学习 (L1_2_2)** 并实现“银发价值再创造”的模式，都为老年人提供了持续发挥**价值感 (L1_1_3)** 的平台，挑战了“攒瓶子、带孙子”的传统**文化环境 (L1_4_4)** 刻板印象。文章强调老年生活需要**未雨绸缪的“规划项目” (L2_3)**。从泰康集团创始人陈东升为改变中国老年生活方式而进行的长期探索，到宋建云对养老机构选择的审慎财务考量（涉及**经济资本 L1_4_1**），再到泰康之家在硬件**适老环境 (L1_4_3)** 设计（如弧形茶几、风雨连廊）和软件服务（人才培养、意见反馈系统）上的精细化管理和**未来规划 (L1_5_1)**，均体现了系统性规划的重要性。同时，文章也深刻揭示了**科技赋能的“现代晚年” (L2_4)**。泰康之家的“医养结合”模式是核心优势，通过“家门口的医院”、慢病管理、强大的急救体系（如拉绳警报、多学科团队），以及对老人使用智能手机的指导，保障了长辈的**身体管理 (L1_2_4)** 和生活便利，这是**科技赋能 (L1_4_2)** 在养老领域的具体应用。最后，文章通过“谈笑有鸿儒，往来无白丁”的优质**朋辈社交 (L1_3_3)** 环境，以及护理团队“三心”服务所提供的专业照护，弥补了子女可能无法提供的陪伴，构建了**情感丰盈的“圆满时节” (L2_2)**。整体而言，文章通过多个案例和机构运营细节，呈现了一个由多重支持系统构筑的、积极而有保障的“理想八旬”生活。","highlights":[],"timestamp":1715270400000,"l1Names":["积极心态","自主独立","价值感","社会参与","终身学习","休闲娱乐","身体管理","朋辈社交","科技赋能","适老环境","文化环境","未来规划","成功典范"],"l2Names":["框架一：活力自主的“第二人生”","框架二：情感丰盈的“圆满时节”","框架三：未雨绸缪的“规划项目”","框架四：科技赋能的“现代晚年”"],"dateStr":"2024/5/10"},{"uuid":"3915b88c-940f-40a3-a603-f55d56cda4f1","title":"当楼市都在谈论涨跌，我们选择谈谈生活","articleUrl":"https://www.lifeweek.com.cn/article/254979","content":"过去二十年间，中国家庭的购房决策，大多被一种“必要性”驱动。房子被视为通往婚姻的门票、子女未来的起跑线，更是许多家庭的核心资产。我们热衷于谈论地段、学区、升值潜力，却往往忽略了它最本质的意义——生活在其中的具体感受。\n随着人们物质与精神层面的同步成长，一种新的住房需求正悄然浮现，并逐渐主流化。它不再是出于人生某个阶段的刚性“需要”，而是源于一种主动的“渴望”——这便是继“刚需盘”与“改善盘”之后，“第二居所”的兴起。\n生活在别处，永远对人们充满诱惑\n人们开始渴望“第二居所”，背后是深刻的社会心态变迁。\n它是对生活多样性的追求。城市中的第一居所，完美地服务于效率与拼搏，却也固化了生活的体验。“第二居所”则更像一个开关，让人从“996”的节奏中瞬间切换至“山系生活”或“田园牧歌”。它也是为未来康养未雨绸缪。随着父母年岁渐长，自身也对未来养老有所规划，一个比城市更贴近自然、比传统养老院更富有生活气息的场所，成为理想选择。它还是对高质量家庭时光的珍视。在城里，家庭成员往往各自对着屏幕，交流被稀释在碎片化的时间里。“第二居所”提供了一个纯粹的“生活的现场”。\n是“第二居所”，也是“生活现场”\n正因为承载着如此厚重的期待，人们对“第二居所”的要求也远比传统房产更为严苛。它必须足够近，是繁忙工作与宁静生活间的完美缓冲带，也需要有真实的自然价值，绿化不能是点缀，而是得天独厚、不可复制的生态资源。好山好水好空气，在任何时候都是核心疗愈力。它还需要完善的生活配套，不能是“美丽的空城”。有坚实的医疗、商业与社群运营作支撑，生活才能便利与安心。\n我们对“第二居所”的渴望很强烈，需求也十分丰富。这些渴望与需求，真的能被满足与回应吗？\n一个半小时外的“生活现场”\n河北省兴隆县地处燕山山脉，坐拥鲜明地域特色——当地特产山楂与板栗口碑出众，山楂入口酸甜清香，板栗则软糯甘甜，尽显山野物产的天然风味。在这片绿意盎然的青翠山谷中，国际文旅康养区 “北京山谷” 顺势而生，以小镇形态承载多元居住与休闲功能。\n走进 “北京山谷” 园区，空间布局层次分明：入口处是儿童无动力乐园 “小浪花乐园”，为亲子互动提供专属场地；继续前行，便是开阔的大片绿地，尽展自然惬意；穿过园区内的酒店，眼前呈现成片的合院与公寓，同步配套社区食堂、餐饮及山野市集，满足日常居住与生活采购需求；再往深处走，便是兼具医疗与康养功能的中国电建康复中心，呵护居住者的健康。\n俯瞰“北京山谷”\n“北京山谷”虽地处环京区域，却未因 “环京” 属性与北京核心区拉开生活距离，反而凭借合理的区位优势，保持着与城区紧密的生活联结。正如一位业主所言：“在北京，我儿子从他自己家出门，遇上堵车也才要一个半小时就能到我这儿；但即便如此，这和他在北京市内跨区出行的时间也差不多。虽说我住在这里算是旅居，可一点不影响他常来看看我。”\n除了交通较为便利，作为“山系第二居所”，“北京山谷”的魅力更在于“三面环山，一面邻水” 的稀缺生态资源。\n夏季，来自北京的方阿姨和刘叔叔是“北京山谷”的常住业主，“相比北京盛夏的桑拿天，山谷里的日均气温要低上8-10°C，有时候早上起得早，在这还要穿上冲锋衣。这不是说这里不舒服，而是真的凉爽。”\n相比城区，山谷里的气温更为清凉\n清晨起床后，夫妇两人大多会去附近徒步。出门不远就是徒步山道，漫步而行，一上午就过去了。“每天溜达一圈，感觉精力都变好了。之前在城里，身体总感觉很乏。这里空气好，我之前阳过，嗓子里总感觉有痰。在这里，我出门都习惯先大口吸上一口新鲜空气，住了一个月，嗓子的不适感消失了。”这正是因为北京山谷周边森林覆盖率高达 71.2%，是天然的氧吧。\n山林之外，山谷里的汤泉也是北京周边十分稀缺的资源。家住海淀的王叔叔是一位汤泉爱好者，“我之前总去北京西山或南宫泡汤泉，去一趟挺不方便，也不便宜。在北京山谷，在自己家院里就能随时享受。尤其在冬天的时候，池子里往外冒着水蒸气，整个露天小院都变得很温暖。”\n“北京山谷”汤泉入户\n对于康养社区而言，仅仅为人们提供享乐是远远不够的，尤其对于老年人来说，医疗保障是一切的基础。相比其他不少文旅项目所设置的社区门诊，“北京山谷”的中国电建康复中心，是一家拥有全科门诊、急救中心、康复中心、体检中心、健康检测中心及远程医疗中心的大型综合性康复中心，能够全方位地保障业主健康。依托中国电建康复中心，“北京山谷”打造了健康大数据中心+全场景健康生活终端+健康管家的“真·智慧康养”，为业主提供了真真切切的健康保障。“对于我们老年人来说，医院是最重要的，吃、住都是其次。在北京，医院离家再近也要走一段，在山谷，下楼就是医院。”一位业主如是说道。\n中国电建康复中心\n除了医疗配套，“北京山谷”还为孩子们提供了室内“淘气堡”和户外“小浪花乐园”。在配套硬件之外，“北京山谷”也并未忽略社群运营。每年，这里会组织数百场社群活动，200多种自然研学课程，不仅能帮助业主实现高质量陪伴，还通过丰富的社群活动，帮助业主们构建熟人社区，营造人与人之间的温暖连接。\n小浪花乐园\n“北京山谷”得天独厚的环境优势，加上完善的配套与高品质的运营，恰恰全面贴合了当代人对于“第二居所”的需求，为人们提供一个舒适、宜人、松弛且接地气的家。夜晚，是无污染星空下的沉思；白天，是孩子们在 “小浪花乐园” 的安全嬉戏，是长者在康养步道上的悠然。这些看似平常的细节，被精心“埋”在社区的肌理中，共同构成当下最令人惬意的“生活现场”。\n有温度的日常\n“北京山谷”最大的标签，是“有温度的美好家园”。而温度并不只体现在社区硬件本身，更体现在每一天的日常服务中。在业主眼中，“北京山谷”的工作人员像家人，在这里，他们帮业主搬运行李、重物回家，在社区食堂照应孩子和宠物、帮助行动不便的老年人打饭……对于业主们的需求，山谷里的工作人员总会及时响应。\n在“北京山谷”的工作人员总能为业主提供体贴周到的服务\n“北京山谷”的工作人员为何能对业主持续抱有热情？管理与规章固然是一方面，但这一定有更深层次的动因。\n小李，是“北京山谷”办公室工作的员工，从他的经历中，我们似乎可以找到答案。他是“北京山谷”所在的北坎子村的原住村民，一名典型的“返乡青年”。此前，他一直在南方工作，但在“北京山谷”开始建设后，似乎找到了回家的理由。“父母年纪越来越大，每年只有过年能回家，感觉陪伴他们的机会很少。‘北京山谷’在家门口为我提供了一个在央企工作的机会，稳定、有保障、有发展，那我当然想回来。”“北京山谷”里大部分工作人员，都像小李一样是附近居民，许多人都相互认识。\n除了提供优质就业，项目还大大促进了当地经济和民生发展。小李说：“之前留在村里的老人靠种山楂、板栗，养一点家禽为生，主要还是靠年轻人外出打工补贴家用。现在游客和业主的到来，让本地人有了更多赚钱的可能。而且中国电建康复中心也要投入运营，这对我们当地的民生医疗也很有帮助。之前村民看病，需要去县城，现在在家门口就能看病。”\n不仅如此，今年夏天，“北京山谷”联合中国水利水电科学研究院，在研判区域水文、划分洪水风险后，重新规划了当地的防洪建设。工程以“南侧拦蓄截、北侧护疏排、东西挡顺接”构建封闭防洪圈，防洪标准达百年一遇，临水 1403 米挡墙采用浆砌石 + 玻璃防洪墙结构，按不越浪设计。另外，“北京山谷”还联动电建康复中心内的智慧指挥中心，实现全要素实时监测、全过程动态预警，强化防洪韧性。\n滑动查看更多\n“北京山谷”的生活是松弛而和谐的\n正如大家的感受，“北京山谷”与当地正在形成一种相互依存，共建家园的关系。本地的年轻人返回家乡，投入到文旅康养产业中，有干劲更有热情。北京山谷为他们提供培训和实践，让服务的热情和文旅运营的规范融合在一起，也突破了服务者和被服务者的割裂，形成了业主、客人与山谷管家之间的信任与默契，这既是服务及时性的保障，也有利于获得对服务效果的良性互动与反馈，从而成为共建美好家园的伙伴与家人。真正的温暖，从来不是刻意的演出，而是发自肺腑的携手同行。\n一个真正令人舒适的“在别处的家”，究竟是在别人的故乡里，硬生生盖起一片飞地，还是选择与当地人一起，共同建设一个温暖的家园？前者或许能营造一个精致的乌托邦，但它脆弱而悬浮；后者，提供的才是一个能生根、有烟火气的真正的家。\n“北京山谷”把此处新老居民对“美好家园”的渴望凝聚在一起，让家园的概念得以延展和丰满，也让每一天的日常，都充满温度。在这里，你拥有的不仅是一处房产，更是一段与这片土地、与这群人共同书写的新生活。\n“0成本”度假：\n房子交给管家，生活留给自己\n在传统观念里，第二居所往往意味着持续的投入——不仅是购房成本，还包括长期的物业、维护费用，以及最令人头疼的空置期管理。“北京山谷”的房屋托管运营服务，让度假屋从“资产负担”转变为能够自我造血的“优质资产”。\n这一模式的核心理念是把专业的事交给专业的人，把宝贵的时间留给自己。当业主不在山谷时，可以将房屋委托给项目的专业运营团队进行统一管理、维护与租赁。运营团队凭借丰富的酒店管理经验和客户资源，通过长短租结合的方式，为房屋带来稳定的市场曝光与租金收益。\n“北京山谷”样板间\n“这完全改变了第二居所的经济逻辑。”一位已参与托管计划的业主说，“我之前也算过账，房子如果空着，每年还要支出不少费用。但现在交给专业团队运营，产生的收益不仅覆盖了物业、维护这些固定支出，甚至还有盈余来抵扣我每年的度假开销。相当于0成本度假。”\n托管模式让业主无需为房屋的空置而焦虑，也不必为远程管理而烦心，可以真正实现“想来就来”的松弛感。专业的托管服务还确保了房屋始终保持良好状态。运营团队会定期进行维护保养，并在每次客人离开后进行专业清洁，让业主随时返回，都能看到一个整洁如新的家。\n在“北京山谷”，房子不再是被锁上的空置空间，而是持续创造价值的活力单元。这套成熟的托管体系，与项目的自然景观、康养配套一样，成为了\"北京山谷\"独特价值的重要组成部分——它不仅为您提供了一个逃离喧嚣的居所，更提供了一种可持续的、智慧的全新度假生活方式。\n最好的生活，是过给自己的\n今天，购房者的决策逻辑，正从对“政策红利”的追逐，坚定地转向对 “生活品质” 的追求。房子，就是用来住的。 真正的家园，不是刻意的、突兀的、令人一时兴起却很难长久安逸的秀场，而是一种悠长的、浸润在日常点滴中的踏实感。如今的购房者，需要的不是又一个焦虑的投资标的，而是一个能够安放身心、承载家庭记忆的真实空间。\n在点滴日常中收获踏实感\n对于老年人来说，面向未来的养老，远不像过去一样，只代表停止工作，放缓生活。养老已经变成了一个新的开始——去别处生活，建立新的社交，开启第二段人生旅程。对于年轻人来说，生活也不只有在都市中忙碌，在远离职场的地方，他们也可以收获短暂的安宁。北京山谷所提供的，正是这样一种回归生活本真的可能——在政策与市场瞬息万变的环境中，找到那份永恒的生活价值。\n午后最惬意的事，就是在草坪上晒晒太阳\n想象这样一个场景：某个阳光温煦的午后，你坐在北京山谷的院子里，手边是一杯清茶。山风轻轻吹过，带着草木的清新，不远处的草坪上，孩子的笑声随风传来。你心里清楚，稍后还能去泡个舒适的汤泉。此刻，你心中没有一件需要紧急处理的公务，没有一件需要攀比炫耀的俗事，甚至无需思考，只是彻底地放空自己。\n这样的日子，不正是我们内心深处真正渴望的吗？它不喧哗，自有声。它告诉我们，最好的生活，从来不是过给别人看的。","level1Selections":["L1_1_1","L1_1_2","L1_2_1","L1_2_3","L1_2_4","L1_2_5","L1_3_2","L1_3_3","L1_4_1","L1_4_2","L1_4_3","L1_5_1"],"level2Selections":["L2_1","L2_2","L2_3","L2_4"],"notes":"文章深入探讨了“第二居所”作为理想老年生活模式的核心价值。首先，它强调了现代人对生活品质的追求，不再仅限于刚需或改善，而是渴望一种**“松弛感”和“自主独立”**（L1_1_1, L1_1_2）。“最好的生活，从来不是过给别人看的”，这凸显了老年个体**积极心态**（L1_1_1）和**自主独立**（L1_1_2）地规划生活的愿望，将养老视为“一个新的开始——去别处生活，建立新的社交，开启第二段人生旅程”（L1_1_1, L1_2_3, L1_3_3）。\n\n在**行为与活动**层面，文章描绘了丰富的**休闲娱乐**（L1_2_3）场景，如“山系生活”、“田园牧歌”、“泡汤泉”，以及积极的**身体管理**（L1_2_4），例如“每天溜达一圈，感觉精力都变好了”，“嗓子的不适感消失了”，这得益于“天然氧吧”般的**适老环境**（L1_4_3）。社区还通过“数百场社群活动，200多种自然研学课程”促进**社会参与**（L1_2_1）和**朋辈社交**（L1_3_3），构建“熟人社区”，形成“人与人之间的温暖连接”，甚至与工作人员也建立起“像家人”般的关系，体现了**情感丰盈**（L2_2）的愿景。\n\n**资源与环境**方面，“北京山谷”作为案例，提供了极其完备的**适老环境**（L1_4_3）支持，包括“好山好水好空气”的自然生态、“交通便利”、坚实的“医疗、商业与社群运营作支撑”，特别是拥有“全科门诊、急救中心、康复中心”的“中国电建康复中心”，让老年人“下楼就是医院”，充分保障健康。此外，项目通过“健康大数据中心+全场景健康生活终端+健康管家的‘真·智慧康养’”展现了**科技赋能**（L1_4_2），并通过托管服务实现了**经济资本**（L1_4_1）的“0成本度假”模式，将“资产负担”转变为“自我造血的优质资产”，体现了对**未来养老的周密规划**（L1_5_1）。文章还提及“返乡青年”的**经济活动**（L1_2_5）及对当地民生经济的促进，强调了社区与当地的共建关系。\n\n综合来看，该文章描绘的理想老年生活是一种**活力自主的“第二人生”**（L2_1），摆脱了传统养老的束缚，充满新体验；同时，它是一个**情感丰盈的“圆满时节”**（L2_2），通过家庭、朋友和社区建立深度联结；更是一个需要**未雨绸缪的“规划项目”**（L2_3），从居住环境、医疗保障到财务管理都需精心设计；最后，它也是一个**科技赋能的“现代晚年”**（L2_4），通过智慧康养和现代运营模式提升生活品质和便利性。文章通过“北京山谷”的案例，具体展示了如何将这些理想变为现实。","highlights":[],"timestamp":1760716800000,"l1Names":["积极心态","自主独立","社会参与","休闲娱乐","身体管理","经济活动","代际关系","朋辈社交","经济资本","科技赋能","适老环境","未来规划"],"l2Names":["框架一：活力自主的“第二人生”","框架二：情感丰盈的“圆满时节”","框架三：未雨绸缪的“规划项目”","框架四：科技赋能的“现代晚年”"],"dateStr":"2025/10/18"}];
    const l3Raw = "# 理想老年生活：从被动衰退到主动重塑的时代叙事\n\n## 1. 摘要\n\n本报告基于对22篇相关文章的开放编码和主轴编码结果，通过选择性编码构建了一个关于“理想老年生活”的核心理论。研究发现，当代中国社会正经历一场深刻的观念转型，老年不再被视为生命被动衰退的终点，而是个人活力再现、情感联结深化、未来主动规划以及科技赋能的“第二人生”。这一核心理论揭示了从传统“安享晚年”向“积极老龄化”的范式转变，其中个体对自主性、价值感、情感满足和持续成长的追求日益凸显。然而，理想与现实之间仍存在张力，尤其体现在资源（经济、健康）、社会支持和文化观念的适应性上。本报告将深入剖析支撑这一转型叙事的四个核心框架，并探讨其社会学意义。\n\n## 2. 方法与数据分布\n\n本研究采用扎根理论（Grounded Theory）的研究方法，旨在从经验数据中归纳和构建理论。研究过程遵循了开放编码（Level 1）和主轴编码（Level 2）的步骤，并在此基础上进行最终的选择性编码（Level 3），以识别核心范畴并构建一个具有解释力的核心叙事。数据来源于22篇中文文章，这些文章均围绕“理想老年生活”这一主题展开。\n\n在主轴编码阶段，我们提炼出了四个核心叙事框架：\n1.  **框架一：活力自主的“第二人生”**\n2.  **框架二：情感丰盈的“圆满时节”**\n3.  **框架三：未雨绸缪的“规划项目”**\n4.  **框架四：科技赋能的“现代晚年”**\n\n为了评估这些框架在数据中的分布情况，我们对22篇文章中出现的L2框架进行了频次统计：\n\n*   **框架一：活力自主的“第二人生” (L2_1)**：在全部22篇文章中均有提及。\n*   **框架二：情感丰盈的“圆满时节” (L2_2)**：在17篇文章中提及。\n*   **框架三：未雨绸缪的“规划项目” (L2_3)**：在13篇文章中提及。\n*   **框架四：科技赋能的“现代晚年” (L2_4)**：在9篇文章中提及。\n\n**叙事框架分布分析：**\n\n从频次统计可以看出，**“活力自主的‘第二人生’ (L2_1)”** 是最核心、最普遍的叙事框架，在所有文章中均占据主导地位。这表明，在当代中国人对理想老年生活的想象中，摆脱传统束缚、积极主动地生活已成为共识。它代表了对老年刻板印象的颠覆，强调老年阶段仍是个人成长、自我实现和生命力展现的重要时期。\n\n紧随其后的是**“情感丰盈的‘圆满时节’ (L2_2)”**，其在大多数文章中都有所体现。这凸显了人际联结和情感满足在老年生活中不可或缺的地位。无论是以亲密关系、代际关系还是朋辈社交的形式，老年人对归属感和精神慰藉的追求依然强烈。\n\n**“未雨绸缪的‘规划项目’ (L2_3)”** 作为第三大框架，在超过半数的文章中出现，具有显著的重要性。这反映出理想的老年生活并非自然而然发生，而需要个人和社会的积极投入与周密规划。从财务准备、健康管理到生活方式的选择，规划意识贯穿了整个“理想老年生活”的构建过程。\n\n相对而言，**“科技赋能的‘现代晚年’ (L2_4)”** 出现的频次最低，但其在近半数文章中出现，显示出这是一个正在崛起且日益重要的叙事。这表明科技在改善老年生活品质、提升便利性、拓宽老年人活动范围方面的潜力正被广泛关注和实践，预示着未来老年生活与科技融合的趋势。\n\n总体而言，前两个框架构成了理想老年生活的核心价值导向，而第三个框架提供了实现这些价值的路径，第四个框架则代表了实现路径中的新兴工具和手段。它们共同绘制了一幅多维度、动态变化的理想老年图景。\n\n## 3. 叙事框架深度解析\n\n### 3.1 框架一：活力自主的“第二人生”\n\n*   **特点：** 此框架的核心在于将老年视为一个全新的生命阶段，一个可以摆脱传统束缚，积极追求个人兴趣、实现自我价值、保持身心活力的“第二人生”。它强调老年人的主体性、选择权和持续发展能力，挑战了传统上将老年与衰退、被动、依赖画等号的刻板印象。这一阶段被赋予了重新定义自我、探索未知的机会。\n\n*   **典型逻辑：** 老年人通过积极的心态和自主的行动，拒绝年龄的限制，将退休后的生活视为一种解放，能够投入到年轻时因工作和家庭责任而搁置的爱好与追求中。他们通过持续学习、社会参与、休闲娱乐乃至经济活动，保持身心健康，发挥余热，获取新的价值感，并以此构建一个充满能量、自我主导的生命阶段。\n\n*   **证据：**\n    *   文章“当年轻人开始畅想老年生活……”中，55岁的楚修峰诗句“我要做个风一般的少年，学个摩托车去吧！”和53岁的汪一舟“我想骑摩托”的趣事，生动展现了老年人对**休闲娱乐 (L1_2_3)**的追求和不被年龄束缚的**自由精神**。文中更强调“老的是年龄不是人生”。\n    *   “89岁传奇女编辑”戴安娜·阿西尔一生未婚未育，却在晚年“发现其他事情变得越来越有意思”，体现了**自主独立 (L1_1_2)**和**积极心态 (L1_1_1)**。\n    *   纪录片《女人世界》中的92岁柯比奶奶，不仅保持着“当下的生命力和能量”，还在高龄时“给顾客定制私人的服装”，积极参与慈善义演和社区舞蹈，展现了持续的**经济活动 (L1_2_5)**和**社会参与 (L1_2_1)**，充满了**价值感 (L1_1_3)**。\n    *   “不惑之年，混迹老年健身江湖”中的老孔、王师傅、张阿姨通过坚持健身，保持“风雨无阻”、“腱子肉”和“乐呵呵”的**积极心态 (L1_1_1)**，实践着**身体管理 (L1_2_4)**，活出了充满能量的新阶段。\n    *   “在变老之前，他们想明白了这些事…”中，受访者Rank将养老定义为拥有“愿意去做的事情”、“时间由自己支配”，并强调“持续创造价值”的**价值感 (L1_1_3)**和“知识和文化储备、培养兴趣爱好”的**终身学习 (L1_2_2)**。\n    *   “被年轻人遗忘的KTV，正在被老年人占领”显示老年人“更关注放飞自我”的价值观，积极寻找自我表达和娱乐渠道。\n    *   “资讯｜粉丝动辄千万起，中老年网红成为新顶流？”中84岁的汪奶奶通过成为网红，积极参与社会，宣告“老去这件事可以有多酷？”实现了新的**价值感 (L1_1_3)**。\n    *   “中老年人谈恋爱，就应该比年轻人更松弛更自由”中，中老年人恋爱“重在精神交流和‘好玩’”，不被传统束缚，充分展现**自主独立 (L1_1_2)**。\n    *   “理想八旬”的生活中，刘玉兰73岁赴北极探险、学习英语、参与门球队，充分展现了**积极心态 (L1_1_1)**和**自主独立 (L1_1_2)**。\n\n### 3.2 框架二：情感丰盈的“圆满时节”\n\n*   **特点：** 此框架强调老年生活并非孤寂，而是人际联结和情感满足达到丰盛的时期。它涵盖了多样化的情感关系，包括亲密关系（爱情、伴侣）、代际关系（与子女、晚辈的和谐互动）、以及朋辈社交（与同龄朋友的互助、共同兴趣）。在这一阶段，情感的滋养被视为提升生活品质、对抗孤独、获得幸福感的关键。\n\n*   **典型逻辑：** 人是社会性动物，情感需求贯穿生命始终。在老年阶段，随着社会角色和家庭结构的变迁，对情感联结的需求可能更加突出。通过维护和发展多元化的社会关系，老年人能够获得归属感、支持感和价值感，从而让晚年生活更加充实和有意义。\n\n*   **证据：**\n    *   “当年轻人开始畅想老年生活……”描绘了老年人积极的**朋辈社交 (L1_3_3)**，如“老年人喜欢和同龄人交朋友”，“养老院的朋友真是多”；以及90岁奶奶想找后老伴、老伴环游世界的**亲密关系 (L1_3_1)**愿望。\n    *   “89岁传奇女编辑”强调“多和年轻人在一起”以“抵消老年生活中令人不快的因素”，构建积极的**代际关系 (L1_3_2)**。\n    *   《女人世界》中，柯比与小她二十岁的老伴斯蒂芬之间“最动人的爱情”，以及舞团成员间的**朋辈社交**，都为生活带来深厚的情感滋养。\n    *   “不惑之年，混迹老年健身江湖”中，作者与健身苑“硬腿子”老孔成为“忘年交”，老年人通过锻炼交流心得，分享生活，构建了愉悦的**朋辈社交 (L1_3_3)**氛围。\n    *   “在变老之前，他们想明白了这些事…”中，多位受访者提及了**朋辈社交 (L1_3_3)**的重要性，如小石想象的“和老姐妹们一起生活”到樊先生强调的“你的圈子在哪儿，哪儿就是最好的归宿”。\n    *   “一对‘丁克’夫妇，和狗一起步入老年”中，作者夫妇对宠物狗“仔仔”的深情照护和告白“永远都是我的宝贝”，展现了非传统家庭模式下情感的丰盈，以及夫妇间**亲密关系 (L1_3_1)**的深化。\n    *   “裸辞后，我‘躲’进老年大学当老师”中，学生们之间形成了深厚的**朋辈社交 (L1_3_3)**，“约她去唱歌、吃饭”，师生间“完美共振”，揭示了跨越年龄的心灵联结。\n    *   “99年红娘眼中的东北老年相亲局”中，老年人普遍存在的“孤独”是他们寻求伴侣的主要原因，“每天就我自己在这儿自言自语”生动描绘了对**亲密关系 (L1_3_1)**的强烈刚需。\n    *   “惠英红”主演电影《我爱你！》中的老年爱情，展示了老年人在游乐园“手拉着手像孩子一样玩耍”，追求**亲密关系 (L1_3_1)**的浪漫与纯真。\n    *   “老年人的爱情”中，玛戈特和肯的浪漫故事，以及作者奶奶在85岁时恋爱后“越来越像个孩子”的情感释放，都强烈表达了老年人对**亲密关系 (L1_3_1)**的渴望和满足。\n\n### 3.3 框架三：未雨绸缪的“规划项目”\n\n*   **特点：** 此框架侧重于对老年生活进行前瞻性、系统性的思考和准备。它不仅仅是经济上的储蓄，更包括了对健康、居住环境、生活方式、甚至心理建设的全面规划。这种规划意识贯穿个人一生，旨在最大化地掌控晚年生活质量，有效应对潜在的挑战和风险。\n\n*   **典型逻辑：** 理想的老年生活并非随机发生，而是需要投入时间和资源进行精心设计。通过早期规划，个体可以积累足够的经济资本、保持健康的身体状态、选择适宜的居住环境、培养丰富的精神生活，从而在晚年实现**自主独立 (L1_1_2)**和**积极心态 (L1_1_1)**，避免被动应对和遗憾。\n\n*   **证据：**\n    *   “当年轻人开始畅想老年生活……”明确指出“养老，不必一步到位，但要趁早准备”，强调**未来规划 (L1_5_1)**的重要性。\n    *   “89岁传奇女编辑”戴安娜·阿西尔对衰老和死亡进行了深刻的**挑战与应对 (L1_5_3)**，思考“如何能尽力过好这一凋零的时光”，这是一种有意识的**规划**和心理建设。\n    *   “在变老之前，他们想明白了这些事…”中，洪洪提及“至少需要存1000万”，肥丽丝积极“购买养老保险、医疗保险、投资房产”，均强调了**经济资本 (L1_4_1)**的必要性。\n    *   “如何从容地老去：哲学家说老年”传递了对老年生活和死亡进行**哲学性、精神性规划**的理念，即通过从小正视死亡、积极行善来为“从容地老去”做准备。\n    *   “裸辞后，我‘躲’进老年大学当老师”中，一位学生在退休前就“先到老年大学来上课，占个位置”，体现出对充实老年生活的**未来规划 (L1_5_1)**和主动争取。\n    *   “消费降级后，这届老年人用退休金低价‘旅居养老’”揭示了旅居养老市场“粗糙”及安全问题等**挑战 (L1_5_3)**，表明理想的旅居养老并非一蹴而就，而需要个人层面的预算管理与攻略制定，以及行业层面的服务升级与安全保障。\n    *   “如果老年人都去就业，就更没人愿意生小孩了”批判性地评估将老年就业市场视为解决社会问题的**规划项目**，认为其忽视了中国社会深层次的结构性问题。\n    *   “99年红娘眼中的东北老年相亲局”中，老年人在相亲中对对方健康、经济状况的审慎考量，以及对未来共同生活的慎重态度，都表明他们对晚年伴侣关系有着明确的现实规划和保障需求。\n    *   “理想八旬”的生活中，泰康集团创始人陈东升为改变中国老年生活方式进行的长期探索，以及泰康之家在硬件**适老环境 (L1_4_3)**设计上的精细化管理和**未来规划 (L1_5_1)**，均体现了系统性规划的重要性。\n    *   “当楼市都在谈论涨跌，我们选择谈谈生活”中，“第二居所”项目通过托管服务实现了**经济资本 (L1_4_1)**的“0成本度假”，将“资产负担”转变为“自我造血的优质资产”，体现了对**未来养老的周密规划**。\n\n### 3.4 框架四：科技赋能的“现代晚年”\n\n*   **特点：** 此框架关注科技在提升老年生活品质、便利性、安全性和丰富性方面的作用。它不仅仅指高科技的医疗设备，更涵盖了日常生活中智能手机、智能家居、线上社交平台等各种数字工具的应用，以及专业养老服务中的智能化管理。\n\n*   **典型逻辑：** 随着科技的飞速发展，老年人不再是数字世界的旁观者，而是积极的参与者和受益者。科技可以弥补老年人身体机能的衰退，拓展其社交圈，提供便捷的娱乐和学习途径，并提升健康管理水平，从而使得老年生活更加独立、舒适和充满现代感。\n\n*   **证据：**\n    *   “当年轻人开始畅想老年生活……”中，老人“琢磨起手机——用视频软件追剧，刷直播”，年轻人畅想“养老院的电竞房里打游戏”和“无人驾驶轮椅”，都表明科技在提升老年人生活品质和便利度方面不可或缺。\n    *   “音乐的三重滋养”中，退休教师对“泡泡图”这一“用软件做的可视化音乐分析图示”的认可，体现了老年人对**科技赋能 (L1_4_2)**学习的开放态度。\n    *   “裸辞后，我‘躲’进老年大学当老师”中，微信小程序抢课为老年人提供了便利的参与途径。\n    *   “被年轻人遗忘的KTV，正在被老年人占领”中，KTV行业进行“设施的适老化改造”，对老年消费潜力进行响应，侧面反映了科技融入商业服务。\n    *   “资讯｜粉丝动辄千万起，中老年网红成为新顶流？”中，直播平台和社交媒体为中老年网红提供了展现自我的新舞台，是**科技赋能 (L1_4_2)**中老年人实现**价值感 (L1_1_3)**的基础。\n    *   “消费降级后，这届老年人用退休金低价‘旅居养老’”中，直播成为老年人了解和参与旅居的重要渠道，夏红的丈夫则**上网做好攻略**。\n    *   “今年最感人的纪录片：当七八十岁的老年人也要恋爱”中，王敏华阿姨的**网购**，阿宝**手机斗地主**，华鹤定爷爷与**天猫精灵聊天**，这些细节都展现了**科技赋能 (L1_4_2)**的场景。\n    *   “理想八旬”的生活中，泰康之家“医养结合”模式通过“家门口的医院”、慢病管理、急救体系，以及对老人使用智能手机的指导，保障了长辈的**身体管理 (L1_2_4)**和生活便利，是**科技赋能 (L1_4_2)**在养老领域的具体应用。\n    *   “当楼市都在谈论涨跌，我们选择谈谈生活”中，项目通过“健康大数据中心+全场景健康生活终端+健康管家的‘真·智慧康养’”展现了**科技赋能 (L1_4_2)**，提升了老年生活品质和便利性。\n\n## 4. 核心叙事构建\n\n综合上述四个核心框架，我们可以构建一个关于当代中国社会“理想老年生活”的核心叙事理论：**“自我主导的生命再创造：从被动衰退到活力自主、情感丰盈、规划周全与科技赋能的现代晚年。”** 这一理论模型解释了当代中国人如何积极主动地重构“老去”的意义。\n\n传统的“老年”观念往往与“被动衰退”、“安享晚年”甚至“坐等终老”联系在一起，强调退休后回归家庭、照看孙辈、身体机能下降带来的限制。然而，本研究的核心发现明确指示，社会对“老龄”的理解正在经历一个深刻的范式转型：从**“被动衰退”走向“主动再创造”**。\n\n**“活力自主的‘第二人生’ (L2_1)”** 是这一转变的核心驱动力。老年人不再满足于被动接受生命进程，而是积极寻求新的身份认同和生活意义。他们像55岁想学摩托车的楚修峰、92岁仍定制服装的柯比、84岁成为网红的汪奶奶一样，拒绝被年龄标签定义，勇于追求年轻时的梦想或开发新的兴趣，如终身学习、健身、旅游、甚至重返职场。这是一种将老年视为“人生新篇章”的积极心态，强调个人意愿、选择和自我实现。\n\n在此基础上，**“情感丰盈的‘圆满时节’ (L2_2)”** 构成了“再创造”的内在精神支撑。摆脱了年轻时的工作压力，老年人有更多时间投入到人际关系的维护和发展中。无论是寻觅“精神交流和好玩”的爱情、在老年大学建立深厚的朋辈社交，还是与宠物建立非传统的家庭联结，情感的满足是对抗孤独、维系身心健康的关键。这表明，老年生活不仅要“动”起来，更要“暖”起来。\n\n为了确保这种“再创造”的实现，**“未雨绸缪的‘规划项目’ (L2_3)”** 成为必不可少的实践路径。理想老年生活并非幻想，而是需要物质和精神上的充分准备。从千万级的经济储备、购买保险、选择适老社区，到对死亡的哲学思考和对身体健康的持续管理，代际关系中的责任（如“为女儿将来少点负担”而健身），都体现了个人对未来风险的理性预期和主动干预。这种规划思维将老年生活从不可预测的未来转变为可设计、可掌控的人生项目。\n\n最后，**“科技赋能的‘现代晚年’ (L2_4)”** 则为“再创造”提供了强大的外部支持和无限可能。智能手机、直播平台、智慧康养系统、甚至无人驾驶轮椅的想象，都极大地拓展了老年人的生活边界。科技不仅提升了生活便利性、健康管理效率，更成为老年人获取信息、学习新知、表达自我、甚至创造经济价值的新工具，让“现代晚年”充满数字时代的活力与便捷。\n\n然而，在这一理想图景的构建过程中，**“理想”与“现实”之间存在着显著的张力**。\n*   **资源方面：** 理想的老年生活常常伴随着对高品质养老社区、旅居养老、终身学习等需求的提及，这些都需要相当的**经济资本 (L1_4_1)**。然而，现实中“退休金在3000元左右”的老年人“连水果都舍不得买”，经济上的不平等限制了多数人实现理想的可能性。\n*   **健康方面：** 理想中积极的**身体管理 (L1_2_4)** 愿景，如健身、旅居，与老年人面临的“身体衰弱”、“疾病失能”、“认知障碍”等现实**挑战与应对 (L1_5_3)** 形成对照。虽然科技和医养结合模式提供了一定解决方案，但疾病和死亡的客观规律仍是无法完全逾越的障碍。\n*   **社会支持与文化观念：** 理想的老年生活强调**自主独立 (L1_1_2)**和**非传统家庭 (L1_3_4)** 模式（如丁克夫妇与宠物），以及在**朋辈社交 (L1_3_3)**中寻求情感满足。但现实中，许多年轻家庭仍“依靠父母照看小孩”，传统**代际关系 (L1_3_2)**下的孝道观念和社会对老年人角色的刻板印象（如“孤独依然是大部分老人生活的底色”）仍然强大。社会服务体系，如“幼托机构很少”、“旅居养老市场比较粗糙”，也未能完全跟上老年人多元化需求。\n\n因此，当代中国社会正在努力绘制一幅充满活力的老年生活蓝图，但如何弥合理想与现实之间的鸿沟，确保人人都能享有这种“自我主导的生命再创造”，将是未来社会面临的重大挑战。\n\n## 5. 社会学意义\n\n“理想老年生活”从“被动衰退”向“主动再创造”的转型，在社会学层面具有深刻的意义，它触及了身份政治、老龄消费主义以及代际契约的重塑。\n\n**5.1 身份政治：重新定义老年身份与挑战年龄歧视**\n\n这一核心叙事最显著的社会学意义在于它对“老年人”身份的根本性重构。传统上，老年身份常与“无用”、“边缘”、“被照顾者”等负面刻板印象挂钩。然而，“活力自主的‘第二人生’”和“情感丰盈的‘圆满时节’”框架的崛起，直接挑战了这种年龄歧视。文章中的老年人通过学习、健身、恋爱、社交，甚至成为网红或重返职场，展现出强大的生命力、创造力和社会参与度，这使得“老年”不再是简单的生理年龄标签，而是一种可以主动塑造和发展的社会身份。\n\n这种身份的重塑引发了老年群体的**身份政治**：他们不再被动接受社会赋予的角色，而是积极争取自我表达、自我实现和自我价值的权利。例如，84岁汪奶奶成为千万粉丝的网红，92岁柯比奶奶坚持跳舞并定制服装，这些都是老年人通过实际行动，在公众领域宣示“老年也可以很酷”、“时尚不是年轻人的专利”的身份主张。这不仅提升了老年群体的自尊和幸福感，也促使整个社会重新审视和尊重老年人的主体性。社会文化环境也在这种互动中逐渐调整，从对老年人的“模糊化”转向“看见真实的人”，从而推动构建一个更加包容、无年龄歧视的社会。\n\n**5.2 老龄消费主义：银发经济的崛起与生活方式的多元化**\n\n“理想老年生活”的叙事转型深刻推动了老龄消费主义（银发经济）的兴起与发展。当老年人渴望“活力自主”和“情感丰盈”时，他们不再仅仅满足于基本生存需求，而是追求更高品质、更个性化的生活体验。“未雨绸缪的‘规划项目’”框架中对经济资本的强调，以及“科技赋能的‘现代晚年’”中对智慧康养、数字娱乐的采纳，都预示着老年消费市场巨大的潜力和多元化需求。\n\n文章中提及的KTV被老年人占领、旅居养老、养老社区的兴起（如泰康之家）、乃至中老年网红经济的蓬勃发展，都是老龄消费主义的鲜活案例。老年人“有闲又有钱”的群体特征，使他们成为旅游、娱乐、健康管理、教育培训、适老化产品和服务领域的重要消费者。他们对“第二居所”的追求、对智能手机和数字应用的学习和使用，都促使市场开发更多符合老年群体需求的产品和服务。这种消费不仅是物质上的，更是对一种积极、独立、充实生活方式的投资。然而，这也带来了新的挑战：如何确保银发经济的公平性和包容性，避免因经济能力差异而加剧老年群体内部的生活品质分化，以及如何规范市场，保障老年消费者权益，防止过度营销和欺诈。\n\n**5.3 代际契约的重塑：从“养儿防老”到多方共担**\n\n“理想老年生活”的重构也对传统的代际契约，尤其是“养儿防老”的观念构成了深远影响。传统的代际契约强调子女对父母的经济和照护责任（孝道），而父母则通常在晚年承担照看孙辈的责任。然而，当老年人追求“活力自主的‘第二人生’”时，他们对子女的依赖性（尤其是在生活自理和情感陪伴方面）有所降低，同时子女对父母照看孙辈的期望也与父母追求个人生活的愿望产生张力。\n\n文章中，“如果老年人都去就业，就更没人愿意生小孩了”的讨论，直接揭示了老年人照护孙辈的隐性社会价值，以及社会支持体系缺失下代际关系的复杂性。一些老年人选择“非传统家庭”模式（如丁克夫妇），或通过相亲、朋辈社交来解决情感需求，减少对子女的负担。这使得代际契约从单一的“子女赡养父母”模式，向“多方共担”模式转变。在这个新的契约中，个人“未雨绸缪的规划”承担了部分责任，社会（养老机构、老年大学、科技公司）提供了更专业的服务和支持，而子女的责任则可能更多地转向情感支持和决策协助，而非全面的日常照护。\n\n这种重塑也引发了新的社会伦理讨论：如何在尊重老年人追求自主生活的权利与维系家庭温情和代际责任之间取得平衡？如何构建健全的社会养老服务体系，以减轻家庭和子女的压力，让老年人无论经济状况如何，都能享有一个有尊严、有活力的晚年？这些都是摆在当代中国社会面前亟待解决的社会学议题。\n\n综上所述，对“理想老年生活”的重新理解，不仅关乎个体生命的意义，更触及了社会结构、文化观念、经济模式和代际关系的深层变迁。这是一个复杂而动态的过程，既充满机遇，也伴随着挑战。";

    function renderContentWithHighlights(content, highlights) {
       if(!highlights || highlights.length === 0) return content;
       
       const sorted = [...highlights].sort((a, b) => a.start - b.start);
       let html = "";
       let lastIndex = 0;
       
       sorted.forEach(h => {
         if (h.start < lastIndex) return; 
         if (h.start > lastIndex) {
           html += content.slice(lastIndex, h.start);
         }
         html += "<mark>" + content.slice(h.start, h.end) + "</mark>";
         lastIndex = h.end;
       });
       
       if (lastIndex < content.length) {
         html += content.slice(lastIndex);
       }
       return html;
    }

              ${a.l1Names.slice(0, 3).map(n => `<span class="tag tag-l1">${n}</span>`).join('')}

    function openModal(idx) {
      const a = articles[idx];
      document.getElementById('m-title').textContent = a.title;
      
      const contentHtml = renderContentWithHighlights(a.content, a.highlights);
      document.getElementById('m-content').innerHTML = contentHtml;
      
      // Render Notes with marked
      const notesHtml = a.notes ? marked.parse(a.notes) : "无笔记";
      document.getElementById('m-notes').innerHTML = notesHtml;

      document.getElementById('m-link').href = a.articleUrl;
      
      const l2Container = document.getElementById('m-l2');
      l2Container.innerHTML = a.l2Names.length ? a.l2Names.map(n => `<span class="tag tag-l2" style="font-size:0.85rem; padding: 6px 12px; display:inline-block;">${n}</span>`).join('') : '<span style="color:#94a3b8; font-size:0.9rem;">未分类</span>';
      
      const l1Container = document.getElementById('m-l1');
      l1Container.innerHTML = a.l1Names.length ? a.l1Names.map(n => `<span class="tag tag-l1" style="font-size:0.85rem; padding: 4px 10px; display:inline-block;">${n}</span>`).join('') : '<span style="color:#94a3b8; font-size:0.9rem;">无</span>';

      document.getElementById('detail-modal').classList.add('active');
      document.body.style.overflow = 'hidden';
    }

    function closeModal() {
      document.getElementById('detail-modal').classList.remove('active');
      document.body.style.overflow = '';
    }

    // Close on click outside
    document.getElementById('detail-modal').addEventListener('click', (e) => {
      if (e.target.id === 'detail-modal') closeModal();
    });

    // Esc key
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeModal();
    });

    renderList();
  </script>
</body>
</html>
